# Runs the fast checks (tests/README.md) on each pull request and each push to main:
# the type check, the in-page self-tests, the service worker check, the Waves tries check and the stress sections
# at small sizes.
# About a minute in all.
# The UI scenarios and the soak are slow: they run in the Tests workflow (test.yml) instead.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node typecheck.js
      - run: node selftest.js
      - run: node sw.js
      - run: node forfeit.js
      - run: node stress.js all 4
