    const flash = ctx.flashSeats.has(p) ? ' flash' : '';
    let backs = '';
    for (let i = 0; i < v.handCounts[p]; i++) backs += '<span class="mini-back"></span>';
    let note = '';
    if (v.phase === P.DISCARD) note = v.pendingDiscard[p] ? '<div class="discard-note">Choosing 3 discards…</div>' : '<div class="discard-note">Discarded 3 ✓</div>';
    if (v.phase === P.SHOWDOWN_DISCARD && v.showdown.participants.includes(p)) note = v.showdown.pendingDiscard[p] ? '<div class="discard-note">Choosing 1 discard…</div>' : '<div class="discard-note">Discarded 1 ✓</div>';
    return '<div class="seat-head"><span class="seat-name">' + v.players[p].name + '</span>' + badges(v, p) + '</div>' +
      '<div class="score-row"><span class="score' + flash + '">' + v.scores[p] + '<small> / 10</small></span></div>' +
      tricksLine(v, p) +
      '<div class="backs" aria-label="' + v.handCounts[p] + ' cards">' + backs + '</div>' + note + bidBubble(v, p);
  }

  function pilesHTML(v) {
    const parts = [];
    if (v.kittyCount > 0) {
      let cards = '';
      const showFlip = v.flipped && (v.phase === P.BID1 || v.phase === P.BID2);
      const backsN = showFlip ? v.kittyCount - 1 : v.kittyCount;
      for (let i = 0; i < backsN; i++) cards += backHTML();
      if (showFlip) {
        if (v.flippedBlocked) cards += '<div class="tucked" style="position:relative">' + cardHTML(v.flipped, null) + '<span class="blocked-x">✕</span></div>';
        else cards = cardHTML(v.flipped, null, { cls: ['enter'] }) + cards;
      }
      const label = showFlip ? (v.flippedBlocked ? 'Kitty · ' + R.SUIT_NAME[R.card(v.flipped).suit] + ' blocked' : 'Kitty · turned ' + R.shortName(v.flipped)) : 'Kitty (' + v.kittyCount + ')';
      parts.push('<div class="pile"><div class="pile-cards">' + cards + '</div><div>' + label + '</div></div>');
    }
    if (v.outsideCount > 0) {
      parts.push('<div class="pile"><div class="pile-cards">' + backHTML() + '</div><div>Outside pile (' + v.outsideCount + ')</div></div>');
    }
    if (v.trump) {
      parts.push('<div class="trump-big"><span class="sym' + (R.COLOR[v.trump] === 'red' ? ' red' : '') + '">' + R.SYMBOL[v.trump] + '</span><div>Trump: ' + R.SUIT_NAME[v.trump] + '</div></div>');
    }
    if (v.flipped && v.phase !== P.BID1 && v.phase !== P.BID2 && v.phase !== P.JOKER_VOID && !(v.showdown && v.showdown.active)) {
      parts.push('<div class="pile"><div>Turned card: <b>' + R.shortName(v.flipped) + '</b></div></div>');
    }
    return parts.length ? '<div class="piles">' + parts.join('') + '</div>' : '';
  }

  function trickHTML(v, ctx) {
    const done = v.phase === P.TRICK_DONE || v.phase === P.SHOWDOWN_TRICK_DONE || (v.phase === P.GAME_OVER && v.lastTrick && !v.trick.plays.length);
    const plays = done && v.lastTrick ? v.lastTrick.plays : v.trick.plays;
    const winner = done && v.lastTrick ? v.lastTrick.winner : null;
    const leader = plays.length ? plays[0].player : v.trick.leader;
    const number = done && v.lastTrick ? v.lastTrick.number : v.trickNumber;
    const leadSuit = done && v.lastTrick ? v.lastTrick.leadSuit : v.trick.leadSuit;
    let label = (v.showdown && v.showdown.active ? 'Showdown trick ' : 'Trick ') + number + ' of ' + v.totalTricks;
    if (leadSuit) label += '<br>Led: ' + symHTML(leadSuit);
    let html = '<div class="trick"><div class="trick-label">' + label + '</div>';
    for (const p of [1, 2, 0]) {
      if (!v.activePlayers.includes(p)) {
        html += '<div class="slot slot-' + p + '"><div class="who">' + v.players[p].name + ' · mediator</div></div>';
        continue;
      }
      const play = plays.find(x => x.player === p);
      const win = winner === p;
      const who = v.players[p].name + (leader === p ? ' <span class="lead-mark">(lead)</span>' : '') + (win ? ' — wins' : '');
      const cardPart = play ? cardHTML(play.card, v.trump, { cls: ctx.newCards.has(play.card) ? ['enter'] : [] }) : '<div class="empty"></div>';
      html += '<div class="slot slot-' + p + (win ? ' win' : '') + '"><div class="who">' + who + '</div>' + cardPart + '</div>';
    }
    return html + '</div>';
  }

  function lastTrickHTML(v) {
    if (!v.lastTrick || v.phase === P.TRICK_DONE || v.phase === P.SHOWDOWN_TRICK_DONE || v.phase === P.GAME_OVER) return '';
    if (!Engine.PLAY_PHASES.includes(v.phase)) return '';
    const lt = v.lastTrick;
    const cards = lt.plays.map(x => cardHTML(x.card, v.trump, { cls: x.player === lt.winner ? ['win-mini'] : [] })).join('');
    return '<div class="lasttrick">Last trick (' + v.players[lt.winner].name + ' won' + (lt.king ? ', +1 King' : '') + '):' + cards + '</div>';
  }

  const OUTCOME_TEXT = {
    CLEAR_WINNER: 'Most tricks', NAMER_SWEEP: 'Namer sweep (all 7)', NON_NAMER_SWEEP: 'Non-namer sweep (all 7)', SHOWDOWN: 'Tie 3–3–1: Showdown'
  };

  /* Signed points: +2 green, −1 red, 0 as a dash. */
  const signed = d => d > 0 ? '<span class="pos">+' + d + '</span>' : d < 0 ? '<span class="neg">−' + (-d) + '</span>' : '—';

  /* Who named trump, in which round, and who dealt. */
  function handMetaHTML(v) {
    const n = p => v.players[p].name;
    const call = v.bidLog.filter(b => b.action !== 'pass').pop();
    const parts = [];
    if (v.trump) parts.push('Trump ' + suitLabel(v.trump) + (call ? ' · ' + (call.action === 'accept' ? 'accepted' : 'named') + ' by ' + n(call.player) + ' (round ' + call.round + ')' : ''));
    if (v.dealer !== null) parts.push('Dealer ' + n(v.dealer));
    return parts.length ? '<div class="meta">' + parts.join(' · ') + '</div>' : '';
  }

  /* Full per-player table for the hand. Rows are sorted by score. */
  function statsTableHTML(v, opts) {
    const n = p => v.players[p].name;
    const st = v.handStats, hs = v.handSummary;
    const sd = opts.showdown ? hs.showdown : null;
    const role = p => {
      const r = [];
      if (hs && p === hs.caller) r.push('namer');
      if (hs && p === hs.mediator) r.push('mediator');
      return (r.length ? ' (' + r.join(', ') + ')' : '') + (v.gameOver && p === v.winner ? ' 🏆' : '');
    };
    const head = ['Player', 'Tricks'];
    if (sd) head.push('SD tricks');
    head.push('King pts');
    if (!opts.preShowdown) head.push(sd ? 'SD pts' : 'Hand pts');
    head.push('Score');
    const rows = [0, 1, 2].slice().sort((a, b) => v.scores[b] - v.scores[a] || a - b).map(p => {
      const c = [n(p) + role(p), hs.tricks[p]];
      if (sd) c.push(hs.participants.includes(p) ? sd.tricks[p] : '—');
      c.push(signed(st.pts[p].king));
      if (!opts.preShowdown) c.push(signed(sd ? st.pts[p].showdown : st.pts[p].hand));
      c.push(v.scores[p]);
      return '<tr><td>' + c.join('</td><td>') + '</td></tr>';
    }).join('');
    return '<div class="stats-wrap"><table class="stats"><tr><th>' + head.join('</th><th>') + '</th></tr>' + rows + '</table></div>';
  }

  function summaryHTML(v) {
    const n = p => v.players[p].name;
    const hs = v.handSummary;
    switch (v.phase) {
      case P.ABANDONED:
        return '<div class="summary"><h3>Hand ' + v.handNumber + ' abandoned</h3><p>All three players passed in both rounds. No points. The deal passes to the left.</p></div>';
      case P.JOKER_VOID:
        return '<div class="summary"><h3>The Joker was turned up</h3><p>The hand is void. ' + n(v.dealer) + ' deals again.</p></div>';
      case P.HAND_SCORE:
        return '<div class="summary"><h3>Hand ' + v.handNumber + ' result</h3><div>' + n(hs.winner) + ' wins the hand: ' + OUTCOME_TEXT[hs.outcome] + '</div>' + handMetaHTML(v) +
          statsTableHTML(v, {}) + '</div>';
      case P.SHOWDOWN_SETUP: {
        const [a, b] = hs.participants;
        return '<div class="summary"><h3>Hand ' + v.handNumber + ': Showdown!</h3><p>' + n(a) + ' and ' + n(b) + ' tied with 3 tricks each. ' + n(hs.mediator) + ' won 1 trick and is the mediator.</p>' + handMetaHTML(v) +
          statsTableHTML(v, { preShowdown: true }) +
          '<p>' + n(hs.mediator) + ' will shuffle the 12 outside cards and deal 6 to each Showdown player. Each discards 1, then they play 5 tricks. Trump stays ' + suitLabel(v.trump) + '.</p><p>Winner +1 · Loser −1 (not below 0) · Kings that win still score +1.</p></div>';
      }
      case P.SHOWDOWN_SCORE: {
        const s = hs.showdown;
        return '<div class="summary"><h3>Hand ' + v.handNumber + ': Showdown result</h3><div>' + n(s.winner) + ' wins the Showdown ' + s.tricks[s.winner] + '–' + s.tricks[s.loser] + '.</div>' + handMetaHTML(v) +
          statsTableHTML(v, { showdown: true }) + '<div class="discard-note">SD = Showdown. Score cannot fall below 0.</div></div>';
      }
      default: return '';
    }
  }
  const summaryText = v => youText(summaryHTML(v));

  const CONTINUE_LABEL = {};
  CONTINUE_LABEL[P.ABANDONED] = 'Next deal';
  CONTINUE_LABEL[P.JOKER_VOID] = 'Redeal';
  CONTINUE_LABEL[P.HAND_SCORE] = 'Next hand';
  CONTINUE_LABEL[P.SHOWDOWN_SETUP] = 'Deal the Showdown';
  CONTINUE_LABEL[P.SHOWDOWN_SCORE] = 'Next hand';

  const statusText = v => youText(statusRaw(v));
  function statusRaw(v) {
    const n = p => v.players[p].name;
    const you = v.seat;
    switch (v.phase) {
      case P.SETUP: return 'Setting up…';
      case P.HAND_START: return 'Hand ' + (v.handNumber + 1) + ' · ' + n(v.dealer) + ' deals.';
      case P.DISCARD: return 'Everyone discards 3 cards face-down to the outside pile.';
      case P.REVEAL: return n(v.dealer) + ' turns up the top kitty card…';
      case P.BID1: return 'Round 1 · ' + (v.bidTurn === you ? 'Your call' : n(v.bidTurn) + ' is deciding') + ' on ' + R.SUIT_NAME[R.card(v.flipped).suit] + '.';
      case P.BID2: return 'Round 2 · ' + (v.bidTurn === you ? 'Your call' : n(v.bidTurn) + ' is deciding') + '. ' + R.SUIT_NAME[R.card(v.flipped).suit] + ' is blocked.';
      case P.EXCHANGE: return n(v.receiver) + ' (left of the namer) takes the kitty card' + (v.exchangeCount > 1 ? 's' : '') + ' and discards ' + v.exchangeCount + '.';
      case P.TRICK_PLAY: case P.SHOWDOWN_PLAY: return (v.currentPlayer === you ? 'Your turn.' : n(v.currentPlayer) + ' is playing…');
      case P.TRICK_DONE: case P.SHOWDOWN_TRICK_DONE: return n(v.lastTrick.winner) + ' wins the trick with ' + R.shortName(v.lastTrick.card) + (v.lastTrick.king ? ' — +1 King point!' : '.');
      case P.SHOWDOWN_DISCARD: return 'Showdown · each Showdown player discards 1 card.';
      case P.GAME_OVER: return n(v.winner) + ' wins the game!';
      default: return '';
    }
  }

  function actionBarHTML(v, ui, ctx) {
    const you = v.seat;
    const n = p => v.players[p].name;
    const sel = ui.selected.size;
    const L = Engine.seatAfter(you);
    if (v.gameOver) return '<div class="prompt">Game over — ' + n(v.winner) + ' wins.</div><button class="btn primary" type="button" data-action="new-game-now">Play again</button>';
    if (ui.autoplay && isTurn(v, you)) return '<div class="prompt">AI is playing your seat (debug autoplay).</div>';
    switch (v.phase) {
      case P.DISCARD:
        if (v.pendingDiscard[you]) return '<div class="prompt">Choose 3 cards to discard face-down to the outside pile (' + sel + '/3).</div><div class="hint">Trump is not known yet. The outside pile is used again only in a Showdown.</div><button class="btn primary" type="button" data-action="confirm-discard"' + (sel === 3 ? '' : ' disabled') + '>Discard 3</button>';
        break;
      case P.BID1:
        if (v.bidTurn === you) {
          const s = R.card(v.flipped).suit;
          return '<div class="prompt">Accept ' + suitLabel(s) + ' as trump?</div><div class="hint">If you accept, the ' + R.shortName(v.flipped) + ' goes to ' + n(L) + ' (your left), who then discards 1. The other 2 kitty cards go to the outside pile.</div><button class="btn primary" type="button" data-action="bid-accept">Accept ' + R.SYMBOL[s] + '</button><button class="btn" type="button" data-action="bid-pass">Pass</button>';
        }
        break;
      case P.BID2:
        if (v.bidTurn === you) {
          const blocked = R.card(v.flipped).suit;
          const btns = R.SUITS.map(s => '<button class="btn suit ' + R.COLOR[s] + '" type="button" data-action="name-suit" data-suit="' + s + '"' + (s === blocked ? ' disabled title="Blocked: this suit was turned down"' : '') + '>' + R.SYMBOL[s] + ' ' + R.SUIT_NAME[s] + '</button>').join('');
          const lastNote = v.dealer === you ? ' If you pass too, the hand is abandoned.' : '';
          return '<div class="prompt">Round 2: name a trump suit or pass.</div><div class="hint">If you name a suit, the 2 face-down kitty cards go to ' + n(L) + ' (your left), who then discards 2.' + lastNote + '</div>' + btns + '<button class="btn" type="button" data-action="name-pass">Pass</button>';
        }
        break;
      case P.EXCHANGE:
        if (v.receiver === you) return '<div class="prompt">' + n(v.caller) + ' named ' + suitLabel(v.trump) + '. You receive ' + v.received.map(R.shortName).join(', ') + '. Discard ' + v.exchangeCount + ' (' + sel + '/' + v.exchangeCount + ').</div><button class="btn primary" type="button" data-action="confirm-exchange"' + (sel === v.exchangeCount ? '' : ' disabled') + '>Discard ' + v.exchangeCount + '</button>';
        break;
      case P.SHOWDOWN_DISCARD:
        if (v.showdown.pendingDiscard[you]) return '<div class="prompt">Showdown: discard 1 of your 6 cards (' + sel + '/1). Trump is ' + suitLabel(v.trump) + '.</div><button class="btn primary" type="button" data-action="confirm-sd-discard"' + (sel === 1 ? '' : ' disabled') + '>Discard 1</button>';
        break;
      case P.TRICK_PLAY:
      case P.SHOWDOWN_PLAY:
        if (v.currentPlayer === you) {
          const must = v.trick.leadSuit && v.legal.length < v.hand.length;
          return '<div class="prompt">Your turn: ' + (v.trick.plays.length ? 'play a card.' : 'lead a card.') + '</div>' + (must ? '<div class="hint">You must follow ' + suitLabel(v.trick.leadSuit) + '. Cards that you cannot play are disabled.</div>' : (v.trick.leadSuit ? '<div class="hint">You have no ' + R.SUIT_NAME[v.trick.leadSuit] + ': play any card.</div>' : ''));
        }
        break;
      default: break;
    }
    if (CONTINUE_LABEL[v.phase]) return '<button class="btn primary" type="button" data-action="continue">' + CONTINUE_LABEL[v.phase] + '</button>';
    if (ctx.waiting) return '<div class="hint">' + statusText(v) + '</div><button class="btn" type="button" data-action="skip">Skip ▶</button>';
    return '<div class="hint">' + statusText(v) + '</div>';
  }

  function handHTML(v, ui) {
    const you = v.seat;
    const sorted = R.sortHand(v.hand, v.trump);
    const ph = v.phase;
    let mode = 'none';
    if (!v.gameOver && !ui.autoplay) {
      if (ph === P.DISCARD && v.pendingDiscard[you]) mode = 'select';
      else if (ph === P.EXCHANGE && v.receiver === you) mode = 'select';
      else if (ph === P.SHOWDOWN_DISCARD && v.showdown.pendingDiscard[you]) mode = 'select';
      else if (Engine.PLAY_PHASES.includes(ph) && v.currentPlayer === you) mode = 'play';
    }
    if (!sorted.length) return '<div class="hand"><div class="hint">' + (v.showdown && v.showdown.active && !v.showdown.participants.includes(you) ? 'You are the mediator. Watch the Showdown.' : 'No cards in hand.') + '</div></div>';
    const cards = sorted.map(id => {
      const isNew = v.received.includes(id) && ph === P.EXCHANGE;
      if (mode === 'select') return cardHTML(id, v.trump, { button: true, cls: ['selectable'].concat(ui.selected.has(id) ? ['selected'] : []), isNew });
      if (mode === 'play') {
        const legal = v.legal.includes(id);
        return cardHTML(id, v.trump, { button: true, disabled: !legal, cls: legal ? ['legal'] : ['illegal'] });
      }
      return cardHTML(id, v.trump, { button: true, disabled: true, cls: ['idle'], isNew });
    }).join('');
    return '<div class="hand" id="hand">' + cards + '</div>';
  }

  /* Small counter in the top bar: hand number, and the trick number while tricks are played. */
  function handChipText(v) {
    if (!v.handNumber) return '';
    let t = 'Hand ' + v.handNumber;
    if (v.trickNumber > 0 && v.trick && (Engine.PLAY_PHASES.includes(v.phase) || v.phase === P.TRICK_DONE || v.phase === P.SHOWDOWN_TRICK_DONE)) {
      t += ' · ' + (v.showdown && v.showdown.active ? 'Showdown trick ' : 'Trick ') + v.trickNumber + '/' + v.totalTricks;
    }
    return t;
  }

  function render(v, ui, ctx) {
    const table = $('table');
    table.classList.toggle('showdown', !!(v.showdown && (v.showdown.active || v.phase === P.SHOWDOWN_SETUP)));
    $('trumpChip').innerHTML = v.trump ? 'Trump: ' + suitLabel(v.trump) : 'Trump: —';
    $('handChip').textContent = handChipText(v);
    for (const p of [1, 2]) {
      const el = $('seat' + p);
      el.innerHTML = seatHTML(v, p, ctx);
      el.classList.toggle('turn', isTurn(v, p));
      el.classList.toggle('out', !!(v.showdown && v.showdown.active && !v.showdown.participants.includes(p)));
    }
    let center = '';
    if (v.showdown && (v.showdown.active || v.phase === P.SHOWDOWN_SETUP)) {
      const parts = v.showdown.participants.map(p => v.players[p].name).join(' vs ');
      center += '<div class="banner">SHOWDOWN<small>' + parts + ' · mediator: ' + v.players[v.showdown.mediator].name + '</small></div>';
    }
    center += pilesHTML(v);
    const summary = summaryText(v);
    if (summary) center += summary;
    else if (Engine.PLAY_PHASES.includes(v.phase) || v.phase === P.TRICK_DONE || v.phase === P.SHOWDOWN_TRICK_DONE || (v.phase === P.GAME_OVER && v.lastTrick)) center += trickHTML(v, ctx);
    center += '<div class="status">' + statusText(v) + '</div>' + lastTrickHTML(v);
    $('center').innerHTML = center;

    const me = $('seat0');
    const flash = ctx.flashSeats.has(v.seat) ? ' flash' : '';
    me.innerHTML = '<div class="me-head"><span class="seat-name">' + v.players[v.seat].name + '</span>' + badges(v, v.seat) +
      '<span class="score' + flash + '">' + v.scores[v.seat] + '<small> / 10</small></span>' + tricksLine(v, v.seat) + bidBubble(v, v.seat) + '</div>' +
      '<div class="actionbar">' + actionBarHTML(v, ui, ctx) + '</div>' + handHTML(v, ui);
    me.classList.toggle('turn', isTurn(v, v.seat));
  }

  return Object.freeze({ render, cardHTML, statusText, isTurn, youText, CONTINUE_LABEL, statsTableHTML, handMetaHTML });
})();

/* ---------------------------------------------------------------------
   8. CONTROLLER — game flow, timing, and human input.
   Timers only pace the display. Each timer checks the state version so a
   stale timer can never act on a newer state.
   --------------------------------------------------------------------- */
const App = (() => {
  const R = Rules, P = Engine.P;
  const DELAYS = {
    slow: { ai: 1200, trick: 2300, sys: 600 },
    normal: { ai: 650, trick: 1400, sys: 350 },
    fast: { ai: 220, trick: 650, sys: 120 },
    instant: { ai: 0, trick: 0, sys: 0 }
  };
  const HUMAN = 0;
  const app = {
    state: null,
    ui: { selected: new Set(), selKey: '', speed: 'slow', autoplay: false },
    timer: null, timerFn: null, lastEvents: []
  };
  const $ = id => document.getElementById(id);
  const safe = fn => { try { return fn(); } catch (e) { return null; } };

  function newGame(seed) {
    clearTimer();
    const s = (seed === undefined || seed === null) ? RNG.freshSeed() : (seed >>> 0);
    app.state = Engine.createGame(s);
    app.ui.selected.clear();
    $('gameLog').innerHTML = '';
    $('overlay').hidden = true;
    const dbgSeed = $('dbgSeed');
    if (dbgSeed) dbgSeed.textContent = String(s);
    addLog('New game (seed ' + s + ').', '');
    act({ type: 'START_GAME' });
  }

  function act(action) {
    const res = Engine.dispatch(app.state, action);
    if (!res.ok) { draw([]); return res; }
    app.lastEvents = res.events;
    for (const e of res.events) narrate(e);
    draw(res.events);
    schedule();
    return res;
  }

  function clearTimer() {
    if (app.timer) clearTimeout(app.timer);
    app.timer = null; app.timerFn = null;
  }
  function later(ms, fn) {
    clearTimer();
    const version = app.state.version;
    app.timerFn = () => { app.timer = null; app.timerFn = null; if (app.state.version === version) fn(); };
    app.timer = setTimeout(app.timerFn, ms);
  }
  function skip() { if (app.timerFn) { const f = app.timerFn; clearTimeout(app.timer); f(); } }

  function schedule() {
    clearTimer();
    const st = app.state;
    if (st.gameOver) { showGameOver(); return; }
    const d = DELAYS[app.ui.speed];
    const actors = Engine.actors(st);
    const ai = actors.filter(p => !st.players[p].human || (app.ui.autoplay && p === HUMAN));
    if (ai.length) {
      const p = ai[0];
      later(d.ai, () => act(AI.decide(buildView(app.state, p))));
    } else if (!actors.length) {
      const sys = Engine.systemAction(st);
      if (!sys) return;
      const manual = !!Render.CONTINUE_LABEL[st.phase];
      if (manual && !app.ui.autoplay) return; /* wait for the Continue button */
      const ms = (st.phase === P.TRICK_DONE || st.phase === P.SHOWDOWN_TRICK_DONE || manual) ? d.trick : d.sys;
      later(ms, () => act(sys));
    }
    draw([]);
  }

  function selectionKey(v) { return v.phase + ':' + v.handNumber + ':' + (v.showdown ? 'sd' : '') + ':' + v.receiver; }

  function draw(events) {
    const v = buildView(app.state, HUMAN);
    const key = selectionKey(v);
    if (key !== app.ui.selKey) { app.ui.selected.clear(); app.ui.selKey = key; }
    for (const id of Array.from(app.ui.selected)) if (!v.hand.includes(id)) app.ui.selected.delete(id);
    const ctx = { flashSeats: new Set(), newCards: new Set(), waiting: !!app.timerFn };
    for (const e of events) {
      if (e.type === 'SCORE_CHANGED' && e.delta !== 0) ctx.flashSeats.add(e.player);
      if (e.type === 'CARD_PLAYED') ctx.newCards.add(e.card);
    }
    Render.render(v, app.ui, ctx);
  }

  /* ---- Narration: public events -> human-readable log + toasts ---- */
  function addLog(text, cls) {
    const li = document.createElement('li');
    li.textContent = Render.youText(text);
    if (cls) li.className = cls;
    const ol = $('gameLog');
    ol.appendChild(li);
    while (ol.children.length > 400) ol.removeChild(ol.firstChild);
    ol.scrollTop = ol.scrollHeight;
  }
  function toast(text, cls) {
    const t = document.createElement('div');
    t.className = 'toast' + (cls ? ' ' + cls : '');
    t.textContent = Render.youText(text);
    const box = $('toasts');
    box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => t.remove(), 2700);
  }
  const REASON = {
    KING: 'King won a trick', SHOWDOWN_KING: 'King won a Showdown trick', CLEAR_WINNER: 'most tricks',
    NAMER_SWEEP: 'namer sweep', NON_NAMER_SWEEP: 'non-namer sweep', SHOWDOWN_WIN: 'won the Showdown', SHOWDOWN_LOSS: 'lost the Showdown'
  };
  function narrate(e) {
    const st = app.state;
    const n = p => st.players[p].name;
    switch (e.type) {
      case 'DEAL': addLog('Hand ' + e.hand + ': ' + n(e.dealer) + ' deals 10 cards to each player and 3 to the kitty.', 'h'); break;
      case 'DISCARD': addLog(n(e.player) + ' discards 3 cards to the outside pile.', ''); break;
      case 'KITTY_FLIPPED': addLog(n(st.dealer) + ' turns up ' + R.shortName(e.card) + '.', ''); break;
      case 'HAND_VOID': addLog('The Joker was turned. The hand is void and will be dealt again.', 'h'); toast('Joker turned — redeal', 'info'); break;
      case 'BID_PASS': addLog(n(e.player) + ' passes (round ' + e.round + ').', ''); break;
      case 'BIDDING_ROUND': if (e.round === 2) addLog('Round 2: ' + R.SUIT_NAME[e.blocked] + ' is blocked. Players may name another suit.', ''); break;
      case 'TRUMP_ACCEPTED': addLog(n(e.player) + ' accepts ' + R.SUIT_NAME[e.suit] + ' as trump.', 'h'); toast(n(e.player) + ' accepts ' + R.SYMBOL[e.suit] + ' trump', 'info'); break;
      case 'TRUMP_NAMED': addLog(n(e.player) + ' names ' + R.SUIT_NAME[e.suit] + ' as trump.', 'h'); toast(n(e.player) + ' names ' + R.SYMBOL[e.suit] + ' trump', 'info'); break;
      case 'KITTY_TRANSFER': addLog((e.publicCard ? R.shortName(e.publicCard) : 'The 2 face-down kitty cards') + ' go' + (e.publicCard ? 'es' : '') + ' to ' + n(e.to) + ' (left of the namer).', ''); break;
      case 'EXCHANGE_DISCARD': addLog(n(e.player) + ' discards ' + e.count + ' to the outside pile.', ''); break;
      case 'HAND_ABANDONED': addLog('Everyone passed twice. The hand is abandoned.', 'h'); break;
      case 'TRICK_STARTED': if (e.number === 1) addLog((e.showdown ? 'Showdown' : 'Play') + ' begins. ' + n(e.leader) + ' leads.', ''); break;
      case 'CARD_PLAYED': addLog(n(e.player) + ' plays ' + R.shortName(e.card) + '.', ''); break;
      case 'TRICK_WON': case 'SHOWDOWN_TRICK_WON': addLog(n(e.winner) + ' wins ' + (e.type === 'SHOWDOWN_TRICK_WON' ? 'Showdown ' : '') + 'trick ' + e.number + ' with ' + R.shortName(e.card) + '.', ''); break;
      case 'KING_SCORED': addLog('♔ +1 to ' + n(e.player) + ': ' + R.shortName(e.card) + ' won the trick.', 'k'); toast('♔ +1 ' + n(e.player) + ' — ' + R.shortName(e.card) + ' wins the trick!'); break;
      case 'SCORE_CHANGED':
        if (e.reason !== 'KING' && e.reason !== 'SHOWDOWN_KING') {
          const sign = e.delta > 0 ? '+' + e.delta : (e.delta < 0 ? '−' + (-e.delta) : (e.requested < 0 ? '−0' : '0'));
          addLog(sign + ' to ' + n(e.player) + ' (' + REASON[e.reason] + (e.requested < 0 && e.delta === 0 ? ', already at 0' : '') + '). Score: ' + e.score + '.', e.delta < 0 || e.requested < 0 ? 's' : 'k');
          toast(sign + ' ' + n(e.player) + ' — ' + REASON[e.reason], e.requested < 0 ? 'neg' : '');
        }
        break;
      case 'HAND_SCORED': addLog('Hand tricks: ' + st.players.map((p, i) => p.name + ' ' + e.tricks[i]).join(', ') + '.', 'h'); break;
      case 'SHOWDOWN_STARTED': addLog('SHOWDOWN! ' + n(e.participants[0]) + ' and ' + n(e.participants[1]) + ' tied 3–3. ' + n(e.mediator) + ' is the mediator.', 's'); toast('SHOWDOWN!', 'neg'); break;
      case 'SHOWDOWN_DEAL': addLog(n(e.mediator) + ' shuffles the 12 outside cards and deals 6 to each Showdown player.', 's'); break;
      case 'SHOWDOWN_DISCARD': addLog(n(e.player) + ' discards 1 Showdown card.', ''); break;
      case 'SHOWDOWN_LEAD': addLog(n(e.player) + ' leads the Showdown (won main trick ' + e.mainTrick + ', the latest by a Showdown player).', 's'); break;
      case 'SHOWDOWN_SCORED': addLog('Showdown tricks: ' + n(e.winner) + ' ' + e.tricks[e.winner] + ', ' + n(e.loser) + ' ' + e.tricks[e.loser] + '.', 's'); break;
      case 'GAME_ENDED': addLog('🏆 ' + n(e.winner) + ' reaches ' + e.scores[e.winner] + ' points and wins the game.', 'w'); break;
      case 'DEALER_ROTATED': addLog('The deal passes to ' + n(e.dealer) + '.', ''); break;
      case 'REDEAL': addLog(n(e.dealer) + ' deals again.', ''); break;
      default: break;
    }
  }

  /* This hand's stats in the game-over box. Mid-hand (no hand result yet) shows tricks and Kings so far. */
  function gameOverHandHTML(v) {
    if (!v.handStats) return '';
    const n = p => v.players[p].name;
    const hs = v.handSummary;
    if (hs && (hs.outcome !== 'SHOWDOWN' || hs.showdown)) return '<div class="summary"><h3>Hand ' + v.handNumber + ' stats</h3>' + Render.handMetaHTML(v) + Render.youText(Render.statsTableHTML(v, { showdown: !!hs.showdown })) + '</div>';
    const st = v.handStats;
    const sd = v.showdown && v.showdown.active;
    const rows = [0, 1, 2].slice().sort((a, b) => v.scores[b] - v.scores[a] || a - b).map(p => {
      const k = st.pts[p].king;
      return '<tr><td>' + n(p) + (p === v.winner ? ' 🏆' : '') + '</td><td>' + v.tricksWon[p] + (sd ? ' + ' + v.showdown.tricksWon[p] + ' SD' : '') + '</td><td>' + (k > 0 ? '+' + k : '—') + '</td><td>' + v.scores[p] + '</td></tr>';
    }).join('');
    return '<div class="summary"><h3>Hand ' + v.handNumber + ' so far</h3>' + Render.handMetaHTML(v) + '<table class="stats"><tr><th>Player</th><th>Tricks</th><th>King pts</th><th>Score</th></tr>' + Render.youText(rows) + '</table></div>';
  }

  function showGameOver() {
    const st = app.state;
    const v = buildView(st, HUMAN);
    const n = p => v.players[p].name;
    const how = {
      KING: 'a King won a trick', SHOWDOWN_KING: 'a King won a Showdown trick', CLEAR_WINNER: 'taking the most tricks',
      NAMER_SWEEP: 'a namer sweep', NON_NAMER_SWEEP: 'a non-namer sweep', SHOWDOWN_WIN: 'winning the Showdown'
    }[v.endEvent.reason] || v.endEvent.reason;
    const rows = [0, 1, 2].slice().sort((a, b) => v.scores[b] - v.scores[a]).map(p => '<tr><td>' + n(p) + (p === v.winner ? ' 🏆' : '') + '</td><td>' + v.scores[p] + '</td></tr>').join('');
    const ov = $('overlay');
    ov.innerHTML = '<div class="modal" role="dialog" aria-label="Game over"><div class="big">' + (v.winner === HUMAN ? 'You win!' : n(v.winner) + ' wins!') + '</div>' +
      '<p>' + Render.youText('The game ended at once, in hand ' + v.handNumber + ', by ' + how + '.') + '</p>' + (v.handStats ? '' : '<table><tr><th>Player</th><th>Score</th></tr>' + rows + '</table>') + gameOverHandHTML(v) +
      '<div class="row"><button class="btn" type="button" data-action="close-overlay">View table</button><button class="btn primary" type="button" data-action="new-game-now">Play again</button></div></div>';
    ov.hidden = false;
  }

  function showRules() {
    const ov = $('overlay');
    ov.innerHTML = '<div class="modal" role="dialog" aria-label="Rules"><h2>King Cut-Throat Euchre — quick rules</h2><ul>' +
      '<li>3 players, every player for themselves. First to <b>10 points</b> wins at once, even mid-trick.</li>' +
      '<li>33-card deck: 7–A in four suits plus the Joker. Deal: 3 each, 3 to the kitty, 4 each, 3 each.</li>' +
      '<li>Trump order: Joker, Right Bower (Jack of trump), Left Bower (other Jack of the same color, counts as trump), A, K, Q, 10, 9, 8, 7.</li>' +
      '<li>Before bidding, everyone discards 3 face-down to the outside pile (7 cards left).</li>' +
      '<li>Round 1: the dealer turns the top kitty card (a Joker voids the hand). Accept its suit or pass. If accepted, the turned card goes to the player <b>left of the caller</b>, who discards 1.</li>' +
      '<li>Round 2: name another suit or pass. If named, the 2 face-down kitty cards go to the player left of the caller, who discards 2. If all pass, the hand is abandoned.</li>' +
      '<li>7 tricks. The player left of the dealer leads. Follow suit if you can.</li>' +
      '<li><b>King points:</b> +1 at once when a King wins a trick. A losing King scores nothing.</li>' +
      '<li>End of hand: most tricks +1 · namer takes all 7: +2 · non-namer takes all 7: +3. There is no euchre penalty.</li>' +
      '<li><b>Showdown:</b> on a 3–3–1 split, the 1-trick player mediates, shuffles the 12 outside cards and deals 6 to each tied player. Each discards 1 and they play 5 tricks with the same trump. The player who won the latest main trick between them leads. Winner +1, loser −1 (not below 0).</li>' +
      '</ul><div class="row"><button class="btn primary" type="button" data-action="close-overlay">Close</button></div></div>';
    ov.hidden = false;
  }

  /* ---- Human input. Engine.validate is the final guard for every action. ---- */
  function onCard(id) {
    const v = buildView(app.state, HUMAN);
    if (app.ui.autoplay) return;
    const sel = app.ui.selected;
    let limit = 0;
    if (v.phase === P.DISCARD && v.pendingDiscard[HUMAN]) limit = 3;
    else if (v.phase === P.EXCHANGE && v.receiver === HUMAN) limit = v.exchangeCount;
    else if (v.phase === P.SHOWDOWN_DISCARD && v.showdown.pendingDiscard[HUMAN]) limit = 1;
    if (limit) {
      if (sel.has(id)) sel.delete(id);
      else if (limit === 1) { sel.clear(); sel.add(id); }
      else if (sel.size < limit) sel.add(id);
      draw([]);
      return;
    }
    if (Engine.PLAY_PHASES.includes(v.phase) && v.currentPlayer === HUMAN && v.legal.includes(id)) {
      act({ type: 'PLAY', player: HUMAN, card: id });
    }
  }

  function onAction(name, el) {
    const sel = Array.from(app.ui.selected);
    switch (name) {
      case 'confirm-discard': act({ type: 'DISCARD', player: HUMAN, cards: sel }); break;
      case 'confirm-exchange': act({ type: 'EXCHANGE', player: HUMAN, cards: sel }); break;
      case 'confirm-sd-discard': act({ type: 'SHOWDOWN_DISCARD', player: HUMAN, card: sel[0] }); break;
      case 'bid-accept': act({ type: 'BID', player: HUMAN, accept: true }); break;
      case 'bid-pass': act({ type: 'BID', player: HUMAN, accept: false }); break;
      case 'name-suit': act({ type: 'NAME', player: HUMAN, suit: el.getAttribute('data-suit') }); break;
      case 'name-pass': act({ type: 'NAME', player: HUMAN, suit: null }); break;
      case 'continue': { const sys = Engine.systemAction(app.state); if (sys) act(sys); break; }
      case 'skip': skip(); break;
      case 'rules': showRules(); break;
      case 'close-overlay': $('overlay').hidden = true; break;
      case 'new-game':
        if (app.state.gameOver || app.state.handNumber <= 1 || window.confirm('Abandon this game and start a new one?')) newGame();
        break;
      case 'new-game-now': newGame(); break;
      case 'toggle-debug': { const d = $('debugPanel'); d.hidden = !d.hidden; break; }
      case 'clear-log': Logger.clear(); $('dbgLog').textContent = ''; $('dbgTests').hidden = true; $('dbgTests').innerHTML = ''; break;
      case 'settings-reset': setThinking(AI.THINKING_DEFAULTS); setKnowledge(AI.KNOWLEDGE_DEFAULTS); break;
      case 'copy-seed': copySeed(); break;
      case 'run-tests': {
        const box = $('dbgTests');
        box.hidden = false;
        box.innerHTML = '<div class="t-sum">Running self-tests…</div>';
        setTimeout(() => showTests(SelfTest.run()), 30);
        break;
      }
      default: break;
    }
  }

  /* AI knowledge switches: change the AI, keep the checkboxes in step, and log the change. */
  function setKnowledge(k) {
    const now = AI.setKnowledge(k);
    for (const box of document.querySelectorAll('[data-knowledge]')) box.checked = now[box.getAttribute('data-knowledge')];
    Logger.log('AI_KNOWLEDGE', now);
    const label = key => { const box = document.querySelector('[data-knowledge="' + key + '"]'); return box ? box.parentElement.querySelector('.k-name').textContent : key; };
    const off = Object.keys(now).filter(key => !now[key]).map(label);
    addLog('AI knowledge: ' + (off.length ? 'off — ' + off.join(', ') : 'all on') + '.', 'h');
  }

  /* Debug panel: copy the seed (the clipboard API can be blocked on local files, so fall back). */
  function copySeed() {
    const seed = String(app.state.seed);
    const done = ok => { $('dbgCopied').textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => { $('dbgCopied').textContent = ''; }, 1500); };
    const fallback = () => {
      const t = document.createElement('textarea');
      t.value = seed; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      t.remove(); done(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(seed).then(() => done(true), fallback);
    else fallback();
  }
  /* Debug panel: self-test results as a summary, one line per area, and any failures. */
  const TEST_AREAS = {
    cards: 'Card ranking', follow: 'Following suit', deal: 'Dealing', bidding: 'Bidding', 'ai knowledge': 'AI knowledge',
    planner: 'AI planner', scoring: 'Scoring', showdown: 'Showdown', restart: 'Restart', simulation: 'Simulated games'
  };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function showTests(res) {
    const areas = new Map();
    for (const r of res.results) {
      const a = areas.get(r.section) || { ok: 0, all: 0 };
      a.all++; if (r.ok) a.ok++;
      areas.set(r.section, a);
    }
    const total = res.results.length;
    const sum = res.failed ? '⚠️ ' + res.failed + ' of ' + total + ' checks failed' : '✅ All ' + total + ' checks passed';
    let html = '<div class="t-sum ' + (res.failed ? 'bad' : 'ok') + '">' + sum + ' <span class="k-hint">(' + (res.ms / 1000).toFixed(1) + ' s)</span></div><ul>';
    for (const [sec, a] of areas) html += '<li class="' + (a.ok === a.all ? '' : 'bad') + '">' + (a.ok === a.all ? '✔ ' : '✖ ') + esc(TEST_AREAS[sec] || sec) + ' <span class="k-hint">' + a.ok + '/' + a.all + '</span></li>';
    html += '</ul>';
    for (const r of res.results.filter(x => !x.ok)) html += '<div class="t-fail">✖ ' + esc(TEST_AREAS[r.section] || r.section) + ': ' + esc(r.name) + (r.detail ? '<small>' + esc(r.detail) + '</small>' : '') + '</div>';
    const st = res.stats;
    const n = x => Number(x).toLocaleString('en-US');
    if (st) html += '<div class="t-stats">Simulated ' + n(st.games) + ' games: ' + n(st.hands) + ' hands, ' + n(st.showdowns) + ' Showdowns, ' + n(st.kingPts) + ' King points. Every one of ' + n(st.illegalRejected) + ' illegal plays was refused.</div>';
    $('dbgTests').innerHTML = html;
  }

  /* AI thinking settings: change the AI, keep the controls in step, and log the change. */
  function setThinking(t) {
    const now = AI.setThinking(t);
    $('dbgWorlds').value = now.worlds;
    const farts = Math.round((1 - now.playoutSkill) * 100);
    $('dbgSkill').value = farts;
    $('dbgSkillOut').textContent = farts + '%';
    Logger.log('AI_THINKING', now);
    addLog('AI thinking: ' + now.worlds + ' hunches, brain farts ' + farts + '%.', 'h');
  }

  function init() {
    document.addEventListener('click', ev => {
      const cardEl = ev.target.closest('button[data-card]');
      if (cardEl && !cardEl.disabled) { onCard(cardEl.getAttribute('data-card')); return; }
      const a = ev.target.closest('[data-action]');
      if (a && !a.disabled) { onAction(a.getAttribute('data-action'), a); return; }
      if (ev.target.closest('#table') && app.timerFn) skip();
    });
    document.addEventListener('keydown', ev => {
      if (ev.key !== ' ' && ev.key !== 'Enter') return;
      if (ev.target && /^(BUTTON|SELECT|INPUT)$/.test(ev.target.tagName)) return;
      ev.preventDefault();
      if (app.timerFn) skip();
      else if (Render.CONTINUE_LABEL[app.state.phase]) onAction('continue');
    });
    const speed = $('speedSel');
    const saved = safe(() => localStorage.getItem('kct-speed'));
    if (saved && DELAYS[saved]) { app.ui.speed = saved; speed.value = saved; }
    speed.addEventListener('change', () => { app.ui.speed = speed.value; safe(() => localStorage.setItem('kct-speed', speed.value)); schedule(); });
    const dbg = $('dbgEnable');
    dbg.addEventListener('change', () => { Logger.enabled = dbg.checked; });
    $('dbgAutoplay').addEventListener('change', e => { app.ui.autoplay = e.target.checked; schedule(); });
    $('dbgWorlds').addEventListener('change', () => setThinking({ worlds: Number($('dbgWorlds').value) }));
    $('dbgSkill').addEventListener('input', () => { $('dbgSkillOut').textContent = $('dbgSkill').value + '%'; });
    $('dbgSkill').addEventListener('change', () => setThinking({ playoutSkill: 1 - Number($('dbgSkill').value) / 100 }));
    for (const box of document.querySelectorAll('[data-knowledge]')) {
      box.checked = AI.knowledge[box.getAttribute('data-knowledge')];
      box.addEventListener('change', () => setKnowledge({ [box.getAttribute('data-knowledge')]: box.checked }));
    }
    Logger.listeners.push(line => { const pre = $('dbgLog'); if (!pre.parentElement.hidden) { pre.textContent += line + '\n'; pre.scrollTop = pre.scrollHeight; } });
    const params = safe(() => new URLSearchParams(location.search)) || new URLSearchParams('');
    if (params.get('debug') === '1') { Logger.enabled = true; dbg.checked = true; $('debugPanel').hidden = false; }
    const seedParam = params.get('seed');
    newGame(seedParam !== null && /^\d+$/.test(seedParam) ? Number(seedParam) : undefined);
  }

  return { init, newGame, act, skip, app };
})();

/* ---------------------------------------------------------------------
   9. SELF-TEST — rule and flow verification. Run from the Debug panel.
   --------------------------------------------------------------------- */
const SelfTest = (() => {
  const R = Rules, P = Engine.P;
  function run(opts) {
    const o = opts || {};
    const results = [];
    const t0 = Date.now();
    const wasLogging = Logger.enabled;
    Logger.enabled = false;
    let section = '';
    const check = (name, ok, detail) => results.push({ section, name, ok: !!ok, detail: ok ? '' : (detail || '') });
    const eq = (name, a, b) => check(name, JSON.stringify(a) === JSON.stringify(b), 'got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b));
    const D = (s, a) => Engine.dispatch(s, a);
    const safeRun = (name, fn) => { section = name; try { fn(); } catch (e) { check(name + ' (exception)', false, String(e && e.stack || e)); } };

    /* --- Card mechanics --- */
    safeRun('cards', () => {
      eq('deck has 33 unique cards', new Set(R.ALL_IDS).size, 33);
      const order = ['JK', 'JS', 'JC', 'AS', 'KS', 'QS', '10S', '9S', '8S', '7S'];
      let ok = true;
      for (let i = 1; i < order.length; i++) if (R.compareCards(order[i - 1], order[i], 'S', 'S') <= 0) ok = false;
      check('trump order Joker > Right > Left > A..7', ok);
      eq('10 trump cards when Spades is trump', R.ALL_IDS.filter(id => R.isTrump(id, 'S')).length, 10);
      eq('same-color suit has 7 cards', R.ALL_IDS.filter(id => R.getEffectiveSuit(id, 'S') === 'C').length, 7);
      eq('other suits have 8 cards', R.ALL_IDS.filter(id => R.getEffectiveSuit(id, 'S') === 'H').length, 8);
      eq('Left Bower effective suit is trump', R.getEffectiveSuit('JC', 'S'), 'S');
      eq('Jack of Clubs is a club when Hearts is trump', R.getEffectiveSuit('JC', 'H'), 'C');
      eq('Joker effective suit is trump', R.getEffectiveSuit('JK', 'D'), 'D');
      const off = ['AH', 'KH', 'QH', 'JH', '10H', '9H', '8H', '7H'];
      ok = true;
      for (let i = 1; i < off.length; i++) if (R.compareCards(off[i - 1], off[i], 'H', 'S') <= 0) ok = false;
      check('non-trump order A K Q J 10 9 8 7', ok);
      eq('off-suit high card cannot win', R.getTrickWinner([{ player: 0, card: '7H' }, { player: 1, card: 'AD' }, { player: 2, card: 'KC' }], 'S').player, 0);
      eq('any trump beats the led suit', R.getTrickWinner([{ player: 0, card: 'AH' }, { player: 1, card: '7S' }, { player: 2, card: 'KH' }], 'S').player, 1);
      eq('Left Bower beats Ace of trump', R.getTrickWinner([{ player: 0, card: 'AS' }, { player: 1, card: 'JC' }, { player: 2, card: 'KS' }], 'S').player, 1);
      eq('Joker beats Right Bower', R.getTrickWinner([{ player: 0, card: 'JS' }, { player: 1, card: 'JK' }], 'S').player, 1);
      eq('Right beats Left', R.getTrickWinner([{ player: 0, card: 'JC' }, { player: 1, card: 'JS' }], 'S').player, 1);
      eq('describeCard Left Bower', [R.describeCard('JC', 'S').effectiveSuit, R.describeCard('JC', 'S').nativeSuit, R.describeCard('JC', 'S').role], ['S', 'C', 'left']);
    });

    /* --- Following suit --- */
    safeRun('follow', () => {
      eq('must follow an ordinary suit', R.legalCards(['AH', '7S', 'KC'], 'H', 'S'), ['AH']);
      eq('Left Bower does not follow its native suit', R.legalCards(['JC', '7H', 'AD'], 'C', 'S'), ['JC', '7H', 'AD']);
      eq('Left Bower must follow a trump lead', R.legalCards(['JC', 'AH'], 'S', 'S'), ['JC']);
      eq('Joker must follow a trump lead', R.legalCards(['JK', 'AH'], 'S', 'S'), ['JK']);
      eq('a Left Bower lead is a trump lead', R.getEffectiveSuit('JC', 'S'), 'S');
      eq('follow a Left Bower lead with trump', R.legalCards(['AS', 'KC', 'QC'], R.getEffectiveSuit('JC', 'S'), 'S'), ['AS']);
      eq('void hand can play anything', R.legalCards(['AH', 'KH'], 'D', 'S'), ['AH', 'KH']);
      eq('must follow trump', R.legalCards(['7S', 'AH', 'JK'], 'S', 'S'), ['7S', 'JK']);
      const s = playState([['9H'], ['KH'], ['AH', '7S']], 'S', 1);
      check('engine rejects a card out of turn', !D(s, { type: 'PLAY', player: 0, card: '9H' }).ok);
      check('engine accepts a legal lead', D(s, { type: 'PLAY', player: 1, card: 'KH' }).ok);
      check('engine rejects a revoke (7S while holding AH)', !D(s, { type: 'PLAY', player: 2, card: '7S' }).ok);

    /* --- Trick scoring --- */
    /* --- AI knowledge: sampled worlds, information boundary, win chances --- */
    safeRun('ai knowledge', () => {
      /* These checks test each kind of knowledge with all the others on. */
      AI.setKnowledge(AI.KNOWLEDGE_ALL_ON);
      AI.setThinking(AI.THINKING_FULL);
      const worldsOf = (st, seat, n) => AI.sampleWorlds(buildView(st, seat), n || 30, { s: 99 });
      const s = revealState(5, 0, '9H');
      D(s, { type: 'FLIP' });
      D(s, { type: 'BID', player: 1, accept: true });
      D(s, { type: 'EXCHANGE', player: 2, cards: [s.hands[2].find(id => id !== '9H')] });
      let ws = worldsOf(s, 0);
      check('round 1 accept: every world puts the turned card in the receiver hand', ws.every(w => w.hands[2].includes('9H')));
      check('worlds keep the true hand sizes', ws.every(w => w.hands[1].length === 7 && w.hands[2].length === 7 && w.outside.length === 12 && w.kitty.length === 0));
      check('worlds hold all 33 cards once', ws.every(w => new Set([].concat(w.hands[0], w.hands[1], w.hands[2], w.outside, s.played)).size === 33));
      check('worlds keep own discards in the outside pile', ws.every(w => s.memory[0].out.every(id => w.outside.includes(id))));
      check('worlds keep the seat\'s own hand', ws.every(w => JSON.stringify(w.hands[0]) === JSON.stringify(s.hands[0])));
      const v = Object.assign(buildView(s, 0), { voids: [[], [], ['H']] });
      check('a void in its suit moves the turned card to the outside pile', AI.sampleWorlds(v, 20, { s: 5 }).every(w => w.outside.includes('9H') && !w.hands[2].includes('9H')));
      const v2 = Object.assign(buildView(s, 0), { voids: [[], ['S'], []] });
      check('worlds respect known voids', AI.sampleWorlds(v2, 30, { s: 6 }).every(w => !w.hands[1].some(id => Rules.getEffectiveSuit(id, 'H') === 'S')));
      const n = revealState(6, 0, '9H');
      D(n, { type: 'FLIP' });
      for (const q of [1, 2, 0]) D(n, { type: 'BID', player: q, accept: false });
      D(n, { type: 'NAME', player: 1, suit: 'S' });
      check('round 2: every world puts the turned card in the outside pile', worldsOf(n, 0).every(w => w.outside.includes('9H')));
      const b = revealState(7, 0, '9H');
      D(b, { type: 'FLIP' });
      check('bid phase: every world keeps the turned card on the kitty', worldsOf(b, 1).every(w => w.kitty[0] === '9H' && w.kitty.length === 3));

      /* The decision depends only on the view: moving hidden cards does not change it. */
      const g = revealState(8, 0, '9H');
      D(g, { type: 'FLIP' });
      const d1 = AI.decide(buildView(g, 1));
      const swap = g.hands[2][0]; g.hands[2][0] = g.hands[0][0]; g.hands[0][0] = swap;
      const k = g.kitty[1]; g.kitty[1] = g.outside[0]; g.outside[0] = k;
      const d2 = AI.decide(buildView(g, 1));
      eq('AI decision ignores hidden cards', d2, d1);
      eq('AI decision is deterministic', AI.decide(buildView(g, 1)), d1);

      const w0 = AI.winChance([0, 0, 0], 0);
      check('win chance at 0-0-0 is about 1/3', Math.abs(w0 - 1 / 3) < 0.01, String(w0));
      check('win chances sum to 1', Math.abs(AI.winChance([3, 7, 1], 0) + AI.winChance([3, 7, 1], 1) + AI.winChance([3, 7, 1], 2) - 1) < 1e-6);
      check('win chance rises with own score', AI.winChance([9, 0, 0], 0) > AI.winChance([5, 0, 0], 0) && AI.winChance([5, 0, 0], 0) > w0);
      check('win chance falls when an opponent nears 10', AI.winChance([0, 9, 0], 0) < AI.winChance([0, 5, 0], 0));
      check('win chance is symmetric between seats', Math.abs(AI.winChance([2, 6, 4], 0) - AI.winChance([2, 4, 6], 0)) < 1e-9);

      /* Knowledge switches: each one changes the worlds as expected, and decisions stay legal. */
      try {
        eq('knowledge defaults: only score watching is on', AI.KNOWLEDGE_DEFAULTS, { bids: false, turnedCard: false, ownDiscards: false, voids: false, scoreAware: true, showdownPlans: false });
        eq('thinking defaults: 10 hunches, 30% brain farts', AI.THINKING_DEFAULTS, { worlds: 10, playoutSkill: 0.7 });
        eq('score watching ramps from 6 to 9 points', [[5, 3, 2], [6, 0, 0], [0, 7, 1], [2, 4, 8], [0, 0, 9]].map(AI.scoreWatch), [0, 0.25, 0.5, 0.75, 1]);
        AI.setKnowledge({ scoreAware: false });
        eq('score watching off: no race weight', AI.scoreWatch([0, 0, 9]), 0);
        AI.setKnowledge(AI.KNOWLEDGE_ALL_ON);
        AI.setKnowledge({ turnedCard: false });
        check('turned-card switch off: some worlds put the turned card elsewhere', worldsOf(s, 0, 40).some(w => !w.hands[2].includes('9H')));
        AI.setKnowledge({ turnedCard: true, ownDiscards: false });
        ws = worldsOf(s, 0, 40);
        check('own-discards switch off: some worlds move own discards out of the outside pile', ws.some(w => !s.memory[0].out.every(id => w.outside.includes(id))));
        check('own-discards switch off: worlds still hold all 33 cards once', ws.every(w => new Set([].concat(w.hands[0], w.hands[1], w.hands[2], w.outside, s.played)).size === 33));
        AI.setKnowledge({ ownDiscards: true, voids: false });
        check('voids switch off: some worlds break a known void', AI.sampleWorlds(v2, 40, { s: 6 }).some(w => w.hands[1].some(id => Rules.getEffectiveSuit(id, 'H') === 'S')));
        AI.setKnowledge(AI.KNOWLEDGE_ALL_ON);
        for (const key of Object.keys(AI.KNOWLEDGE_DEFAULTS)) {
          AI.setKnowledge({ [key]: false });
          const st = revealState(9, 0, '9H');
          D(st, { type: 'FLIP' });
          const ok1 = Engine.validate(st, AI.decide(buildView(st, 1))) === null;
          D(st, { type: 'BID', player: 1, accept: true });
          D(st, { type: 'EXCHANGE', player: 2, cards: [st.hands[2][0]] });
          const ok2 = Engine.validate(st, AI.decide(buildView(st, 1))) === null;
          check('switch ' + key + ' off: AI decisions stay legal', ok1 && ok2);
          AI.setKnowledge(AI.KNOWLEDGE_ALL_ON);
        }
        for (const t of [{ worlds: 1, playoutSkill: 0 }, { worlds: 80, playoutSkill: 0.5 }]) {
          AI.setThinking(t);
          const st = revealState(10, 0, '9H');
          D(st, { type: 'FLIP' });
          D(st, { type: 'BID', player: 1, accept: true });
          D(st, { type: 'EXCHANGE', player: 2, cards: [st.hands[2][0]] });
          check('thinking ' + t.worlds + ' worlds, skill ' + t.playoutSkill + ': AI decisions stay legal', Engine.validate(st, AI.decide(buildView(st, 1))) === null);
        }
        eq('thinking settings clamp to their ranges', AI.setThinking({ worlds: 999, playoutSkill: -1 }), { worlds: 200, playoutSkill: 0 });
      } finally {
        AI.setKnowledge(AI.KNOWLEDGE_DEFAULTS);
        AI.setThinking(AI.THINKING_DEFAULTS);
      }
    });

    safeRun('planner', () => {

        const actors = Engine.actors(s);
        const a = actors.length ? AI.decide(buildView(s, actors[0])) : Engine.systemAction(s);
        if (actors.length) decisions++;
        const r = D(s, a);

      s = playState([['7S'], ['KS'], ['9H']], 'S', 0);

        st.phase = P.SHOWDOWN_TRICK_DONE; st.trickNumber = 5; st.showdown.tricksWon = tw;
        D(st, { type: 'ADVANCE' });

      s = sc([4, 6, 0], [1, 4, 0]);

      s = sc([9, 4, 0], [4, 1, 0]);

    safeRun('hand stats', () => {
      let s = playState([['KH'], ['7H'], ['9H']], 'S', 0);
      playAll(s, [[0, 'KH'], [1, '7H'], [2, '9H']]);
      eq('King card and King point logged', [s.handStats.kings[0], s.handStats.pts[0].king], [['KH'], 1]);
      s.phase = P.TRICK_DONE; s.trickNumber = 7; s.tricksWon = [4, 2, 1];
      D(s, { type: 'ADVANCE' });
      eq('hand point logged apart from King point', [s.handStats.pts[0], s.scores[0]], [{ king: 1, hand: 1, showdown: 0 }, 2]);
      const v = buildView(s, 0);
      const html = Render.statsTableHTML(v, {});
      check('summary table shows King pts and Hand pts', /King pts/.test(html) && /Hand pts/.test(html) && !/\/ 10/.test(html));
      D(s, { type: 'ADVANCE' });
      eq('stats reset for the next hand', s.handStats.pts[0], { king: 0, hand: 0, showdown: 0 });

      const st = Engine.createGame(12); D(st, { type: 'START_GAME' });
      st.trump = 'S'; st.caller = 0; st.tricksWon = [3, 3, 1];
      st.handSummary = { tricks: [3, 3, 1], outcome: 'SHOWDOWN', mediator: 2, participants: [0, 1], caller: 0 };
      st.showdown = { active: true, mediator: 2, participants: [0, 1], pendingDiscard: [false, false, false], discards: [], tricksWon: [3, 2, 0], trickWinners: [], lead: null };
      st.scores = [4, 0, 0]; st.phase = P.SHOWDOWN_TRICK_DONE; st.trickNumber = 5; st.totalTricks = 5;
      D(st, { type: 'ADVANCE' });
      eq('showdown pts are actual changes (loser at 0 logs 0)', [st.handStats.pts[0].showdown, st.handStats.pts[1].showdown], [1, 0]);
    });

    /* --- Restart --- */
    safeRun('restart', () => {
      const s = Engine.createGame(77);
      eq('new game is clean', [s.phase, s.scores, s.handNumber, s.gameOver, Engine.audit(s)], [P.SETUP, [0, 0, 0], 0, false, []]);
    });

    /* --- Full AI-vs-AI simulations with invariants --- */
    safeRun('simulation', () => {
      const games = o.games || 40;
      const stats = { games, hands: 0, showdowns: 0, abandoned: 0, jokerVoid: 0, namerSweep: 0, nonNamerSweep: 0, kingPts: 0, endKing: 0, endShowdown: 0, endHand: 0, illegalRejected: 0, steps: 0 };
      let problems = [];
      for (let g = 0; g < games && problems.length < 5; g++) {
        const s = Engine.createGame(1000 + g);
        D(s, { type: 'START_GAME' });
        let prevDealer = s.dealer, steps = 0;
        while (!s.gameOver && steps < 20000) {
          steps++;
          const actors = Engine.actors(s);
          let action;
          if (actors.length) {
            const p = actors[0];
            const view = buildView(s, p);
            if (Engine.PLAY_PHASES.includes(s.phase)) {
              const illegal = s.hands[p].find(id => !view.legal.includes(id));
              if (illegal) { if (D(s, { type: 'PLAY', player: p, card: illegal }).ok) problems.push('illegal card accepted'); else stats.illegalRejected++; }
              for (const q of [0, 1, 2]) if (q !== p && view.hand.some(id => s.hands[q].includes(id))) problems.push('view leaked a hand');
            }
            action = o.planner ? AI.decide(view) : AI.fastAction(s, p);
          } else action = Engine.systemAction(s);
          const phaseBefore = s.phase;
          if (phaseBefore === P.HAND_SCORE || phaseBefore === P.SHOWDOWN_SCORE || phaseBefore === P.ABANDONED) prevDealer = s.dealer;
          const res = D(s, action);
          if (!res.ok) { problems.push('AI/system action rejected: ' + res.error + ' in ' + phaseBefore); break; }
          const a = Engine.audit(s);
          if (a.length) { problems.push('audit: ' + a.join(',') + ' after ' + action.type); break; }
          if (s.scores.some(x => x < 0)) problems.push('negative score');
          const endIdx = res.events.findIndex(e => e.type === 'GAME_ENDED');
          if (endIdx >= 0 && endIdx !== res.events.length - 1) problems.push('events after GAME_ENDED');
          for (const e of res.events) {
            if (e.type === 'DEAL') stats.hands++;
            if (e.type === 'SHOWDOWN_STARTED') stats.showdowns++;
            if (e.type === 'HAND_ABANDONED') stats.abandoned++;
            if (e.type === 'HAND_VOID') stats.jokerVoid++;
            if (e.type === 'HAND_SCORED' && e.outcome === 'NAMER_SWEEP') stats.namerSweep++;
            if (e.type === 'HAND_SCORED' && e.outcome === 'NON_NAMER_SWEEP') stats.nonNamerSweep++;
            if (e.type === 'KING_SCORED') stats.kingPts++;
            if (e.type === 'TRICK_STARTED' && e.number === 1 && !e.showdown && s.outside.length !== 12) problems.push('outside pile not 12 at play');
            if (e.type === 'DEALER_ROTATED' && e.dealer !== (prevDealer + 1) % 3) problems.push('dealer rotation wrong');
            if (e.type === 'GAME_ENDED') {
              if (/KING/.test(e.reason)) stats.endKing++; else if (/SHOWDOWN/.test(e.reason)) stats.endShowdown++; else stats.endHand++;
            }
          }
        }
        stats.steps += steps;
        if (!s.gameOver) problems.push('game ' + g + ' did not finish');
        else {
          const over = s.scores.filter(x => x >= 10).length;
          if (over !== 1 || s.scores[s.winner] < 10) problems.push('bad final scores ' + s.scores.join('-'));
        }
      }
      check('simulated ' + games + (o.planner ? ' planner' : ' play-out policy') + ' games with no rule violations', problems.length === 0, problems.slice(0, 5).join('; '));
      results.stats = stats;
    });

    Logger.enabled = wasLogging;
    const passed = results.filter(r => r.ok).length;
    return { passed, failed: results.length - passed, results, stats: results.stats, ms: Date.now() - t0 };

    /* helpers (hoisted) */
    function playState(hands, trump, leader, scores) {
      const s = Engine.createGame(7);
      Engine.dispatch(s, { type: 'START_GAME' });
      s.phase = P.TRICK_PLAY; s.trump = trump; s.caller = leader; s.dealer = (leader + 2) % 3;
      s.hands = hands.map(h => h.slice()); s.activePlayers = [0, 1, 2]; s.totalTricks = 7; s.trickNumber = 1;
      s.leader = leader; s.currentPlayer = leader; s.trick = { leader, plays: [], leadSuit: null };
      if (scores) s.scores = scores.slice();
      return s;
    }
    function playAll(s, seq) {
      let last = null;
      for (const [p, c] of seq) { last = Engine.dispatch(s, { type: 'PLAY', player: p, card: c }); if (!last.ok) throw new Error('play rejected: ' + last.error); }
      return last;
    }
    /* Deal, force a chosen card to the kitty top, and discard the first 3 cards of each hand. */
    function revealState(seed, dealer, topCard) {
      const s = Engine.createGame(seed);
      Engine.dispatch(s, { type: 'START_GAME' });
      s.dealer = dealer;
      Engine.dispatch(s, { type: 'DEAL' });
      const where = [s.hands[0], s.hands[1], s.hands[2], s.kitty].find(a => a.includes(topCard));
      const i = where.indexOf(topCard);
      where[i] = s.kitty[0]; s.kitty[0] = topCard;
      for (const p of [0, 1, 2]) Engine.dispatch(s, { type: 'DISCARD', player: p, cards: s.hands[p].slice(0, 3) });
      return s;
    }
  }
  return Object.freeze({ run });
})();

/* ---------------------------------------------------------------------
   10. BOOT
   --------------------------------------------------------------------- */
window.KCT = Object.freeze({ Rules, RNG, Logger, Engine, buildView, AI, Render, App, SelfTest });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init());
else App.init();
</script>
