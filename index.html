<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King Cut-Throat Euchre</title>
<style>
:root{
  --felt:#155a36; --felt-edge:#0c3a22; --felt-showdown:#5a1f45; --felt-showdown-edge:#3a1230;
  --page:#0a2a19; --panel:rgba(0,0,0,.26); --panel-strong:rgba(0,0,0,.42);
  --ink:#f5f2e9; --muted:#bccbbf; --gold:#f2c14e; --gold-ink:#3a2a00;
  --accent:#7cc4ff; --danger:#ff8a80; --good:#9be59b;
  --card:#fffdf6; --card-edge:#d6cfbd; --red:#c62828; --black:#1c1c1e;
  --cw:clamp(46px, 8.6vw, 82px);
  --cw-small:clamp(40px, 6.4vw, 64px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--felt-edge);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{font-weight:800;letter-spacing:.02em;font-size:18px;margin-right:auto}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.18)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.suit{min-width:96px;font-weight:700;background:var(--card);color:var(--black);border-color:var(--card-edge)}
.btn.suit.red{color:var(--red)}
.btn.suit:disabled{text-decoration:line-through}
select{font:inherit;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:5px 6px}
.trump-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel-strong);font-weight:700;white-space:nowrap}
.trump-chip .sym{font-size:20px;line-height:1}
.sym.red{color:#ff6b6b}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px 16px 24px;max-width:1500px;margin:0 auto}
@media (min-width:1150px){.layout{grid-template-columns:minmax(0,1fr) 300px}}
.table{position:relative;display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr) minmax(0,1fr);grid-template-areas:"west center east" "me me me";background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt-edge) 100%);border-radius:18px;padding:12px;border:1px solid rgba(255,255,255,.08);transition:background .4s}
.table.showdown{background:radial-gradient(ellipse at center,var(--felt-showdown) 0%,var(--felt-showdown-edge) 100%)}
@media (max-width:720px){.table{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"west east" "center center" "me me";padding:8px}}
.seat{background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;border:2px solid transparent;transition:border-color .2s, box-shadow .2s}
.seat-west{grid-area:west}.seat-east{grid-area:east}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
.seat.out{opacity:.55}
.seat-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seat-name{font-weight:800;font-size:16px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.16);text-transform:uppercase}
.tag.ai{background:#33507a}.tag.you{background:#7a5c13}
.tag.dealer{background:#ece6d4;color:#222}.tag.caller{background:var(--gold);color:var(--gold-ink)}
.tag.receiver{background:#5e7d5e}.tag.mediator{background:#8e5aa8}.tag.duelist{background:#c2185b}
.score-row{display:flex;align-items:baseline;gap:10px}
.score{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:13px;font-weight:600;color:var(--muted)}
.score.flash{animation:flash 1.3s ease-out}
@keyframes flash{0%{color:var(--gold);transform:scale(1.25)}100%{color:inherit;transform:scale(1)}}
.tricks{font-size:13px;color:var(--muted)}
.tricks b{color:var(--ink)}
.backs{display:flex;flex-wrap:wrap;gap:0;min-height:24px}
.mini-back{width:15px;height:22px;border-radius:3px;margin-right:-4px;border:1px solid #f5f2e9;background:repeating-linear-gradient(45deg,#7a1f2b 0 3px,#93303d 3px 6px)}
.bubble{align-self:flex-start;background:var(--card);color:var(--black);font-weight:700;font-size:13px;border-radius:10px;padding:3px 10px;position:relative}
.bubble.pass{background:#d9d9d9}.bubble.call{background:var(--gold);color:var(--gold-ink)}
.discard-note{font-size:12px;color:var(--muted)}
.center{grid-area:center;display:flex;flex-direction:column;gap:10px;min-width:0;align-items:stretch}
.banner{text-align:center;font-weight:900;letter-spacing:.18em;font-size:20px;padding:6px;border-radius:10px;background:#c2185b;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.banner small{display:block;font-weight:600;letter-spacing:.02em;font-size:13px}
.piles{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;align-items:flex-end}
.pile{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.pile-cards{display:flex;align-items:flex-end;min-height:calc(var(--cw-small)*1.4)}
.pile-cards .card{--w:var(--cw-small)}
.pile-cards .card + .card{margin-left:calc(var(--cw-small)*-.62)}
.tucked{transform:rotate(90deg) translateX(10%);opacity:.85;margin-left:calc(var(--cw-small)*-.2)!important}
.blocked-x{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw-small)*.7);color:rgba(198,40,40,.75);font-weight:900;pointer-events:none}
.trump-big{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.trump-big .sym{font-size:calc(var(--cw-small)*.9);line-height:1.1;color:var(--ink)}
.trump-big .sym.red{color:#ff6b6b}
.trick{position:relative;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;gap:6px 12px;align-items:center;justify-items:center;min-height:calc(var(--cw)*2.2);background:rgba(0,0,0,.14);border-radius:14px;padding:10px}
.trick-label{grid-column:2;grid-row:1;font-size:12px;color:var(--muted);text-align:center;align-self:start}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-width:var(--cw)}
.slot-1{grid-column:1;grid-row:1 / span 2}
.slot-2{grid-column:3;grid-row:1 / span 2}
.slot-0{grid-column:2;grid-row:2}
.slot .empty{width:var(--cw);height:calc(var(--cw)*1.4);border:2px dashed rgba(255,255,255,.18);border-radius:calc(var(--cw)*.09)}
.slot.win .card{box-shadow:0 0 0 4px var(--gold),0 6px 16px rgba(0,0,0,.45)}
.slot.win .who{color:var(--gold);font-weight:800}
.lead-mark{color:var(--accent)}
.summary{background:var(--panel-strong);border-radius:14px;padding:14px 16px;text-align:center}
.summary h3{margin:0 0 8px;font-size:18px}
.summary table{margin:8px auto;border-collapse:collapse;font-variant-numeric:tabular-nums}
.summary td,.summary th{padding:3px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
.summary .pos{color:var(--good);font-weight:800}.summary .neg{color:var(--danger);font-weight:800}
.summary .meta{font-size:12px;color:var(--muted);margin-top:2px}
.summary .stats-wrap{overflow-x:auto;max-width:100%}
.summary table.stats{font-size:13px}
.summary table.stats td,.summary table.stats th{padding:3px 6px}
.summary table.stats th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.summary table.stats td:first-child{text-align:left}
.hand-chip{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.status{text-align:center;font-weight:600;min-height:1.4em}
.lasttrick{display:flex;justify-content:center;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lasttrick .card{--w:30px}
.lasttrick .card .c-tl{font-size:9px}
.lasttrick .card .c-br,.lasttrick .card .c-tag,.lasttrick .card .c-joker{display:none}
.lasttrick .card .c-mid{font-size:15px}
.lasttrick .card.win-mini{box-shadow:0 0 0 2px var(--gold)}
.me{grid-area:me;background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;min-width:0}
.me.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
.me-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.actionbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;min-height:42px;padding:6px;background:rgba(0,0,0,.18);border-radius:10px;text-align:center}
.actionbar .prompt{font-weight:700;width:100%}
.actionbar .hint{font-size:13px;color:var(--muted);width:100%}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:14px 4px 4px;min-height:calc(var(--cw)*1.4 + 18px)}
.card{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.09);background:var(--card);color:var(--black);position:relative;box-shadow:0 1px 3px rgba(0,0,0,.45);border:1px solid var(--card-edge);font-weight:800;flex:none;user-select:none;padding:0;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease, opacity .12s}
.card.red{color:var(--red)}
.card.joker{color:#5b2a86;background:linear-gradient(160deg,#fffdf6 0%,#f3e9ff 100%)}
.card.trump{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold),0 1px 3px rgba(0,0,0,.45)}
.c-tl,.c-br{position:absolute;font-size:calc(var(--w)*.22);line-height:.95;text-align:center}
.c-tl{top:5%;left:7%}
.c-br{bottom:5%;right:7%;transform:rotate(180deg)}
.c-mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.5)}
.c-joker{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-size:calc(var(--w)*.15);letter-spacing:.08em}
.c-tag{position:absolute;top:44%;left:50%;transform:translate(-50%,60%);font-size:calc(var(--w)*.13);background:var(--gold);color:var(--gold-ink);padding:1px 4px;border-radius:3px;letter-spacing:.03em;white-space:nowrap}
.c-new{position:absolute;top:3%;right:4%;font-size:calc(var(--w)*.12);background:var(--accent);color:#07233a;padding:0 3px;border-radius:3px}
.card.back{background:repeating-linear-gradient(45deg,#7a1f2b 0 6px,#93303d 6px 12px);border:2px solid #f5f2e9}
button.card{cursor:pointer}
.hand .card.legal:hover,.hand .card.selectable:hover{transform:translateY(-8px)}
.hand .card.selected{transform:translateY(-14px);box-shadow:0 0 0 3px var(--accent),0 6px 14px rgba(0,0,0,.5)}
.hand .card:disabled{opacity:.38;filter:grayscale(.55);cursor:not-allowed}
.hand .card.legal{box-shadow:0 0 0 2px var(--accent),0 2px 6px rgba(0,0,0,.45)}
.hand .card.legal.trump{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 2px var(--accent),0 2px 6px rgba(0,0,0,.45)}
.card.enter{animation:enter .28s ease-out}
@keyframes enter{from{transform:translateY(14px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.logpanel{background:var(--felt-edge);border-radius:14px;padding:10px 12px;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:200px;max-height:80vh}
.logpanel h2{font-size:14px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gamelog{list-style:none;margin:0;padding:0;overflow:auto;font-size:13px;flex:1;max-height:60vh}
.gamelog li{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.gamelog li.k{color:var(--gold);font-weight:700}
.gamelog li.h{color:var(--accent);font-weight:700}
.gamelog li.s{color:#ff9ad5;font-weight:700}
.gamelog li.w{color:var(--good);font-weight:800}
.toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:10px;padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.4);text-align:center;animation:toast 2.6s ease forwards}
.toast.neg{background:#ffcdd2;color:#5b0d0d}
.toast.info{background:#e3f2fd;color:#0d2a44}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.overlay[hidden]{display:none}
.modal{background:#123f28;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.modal h2{margin:0 0 10px}
.modal .big{font-size:28px;font-weight:900;color:var(--gold)}
.modal table{border-collapse:collapse;margin:10px 0;width:100%}
.modal td,.modal th{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}
.modal ul{padding-left:20px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.debug{position:fixed;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));max-height:85vh;overflow:auto;background:#0b0f0c;border:1px solid #2c4434;border-radius:12px;z-index:60;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.debug[hidden]{display:none}
.debug .dbg-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #2c4434;font-size:14px;position:sticky;top:0;background:#0b0f0c;z-index:1}
.debug .dbg-seed{display:inline-flex;gap:6px;align-items:center}
.debug .dbg-seed code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b8f5c4}
.debug .btn-sm{padding:3px 9px;font-size:12px}
.debug .dbg-close{margin-left:auto;font-size:16px;font-weight:700;padding:9px 18px;min-height:44px}
.debug .dbg-section{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:8px;border-bottom:1px solid #2c4434;font-size:13px}
.debug .dbg-row{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px}
.debug .k-hint{color:#8fb89a;font-size:12px}
.debug input[type=number]{background:#11201a;color:inherit;border:1px solid #2c4434;border-radius:6px;padding:2px 4px}
.debug .dbg-tests{padding:10px;border-bottom:1px solid #2c4434;font-size:13px}
.debug .dbg-tests .t-sum{font-size:15px;font-weight:800;margin-bottom:6px}
.debug .dbg-tests .t-sum.ok{color:#9be59b}.debug .dbg-tests .t-sum.bad{color:#ff8a80}
.debug .dbg-tests ul{list-style:none;margin:0 0 6px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px 12px}
.debug .dbg-tests li.bad{color:#ff8a80;font-weight:700}
.debug .dbg-tests .t-fail{margin:6px 0;padding:6px 8px;background:#2a1212;border-radius:6px}
.debug .dbg-tests .t-fail small{display:block;color:#ffb4ab;word-break:break-word}
.debug .dbg-tests .t-stats{color:#8fb89a}
.debug .dbg-bottom{display:flex;gap:8px;padding:8px;border-top:1px solid #2c4434;position:sticky;bottom:0;background:#0b0f0c}
.debug pre{margin:0;padding:8px;overflow:auto;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b8f5c4;flex:none;min-height:80px;max-height:30vh;white-space:pre-wrap;word-break:break-word}
.debug label{display:inline-flex;gap:4px;align-items:center}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">King Cut-Throat <small>Euchre</small></div>
  <span class="trump-chip" id="trumpChip">Trump: —</span>
  <span class="hand-chip" id="handChip"></span>
  <div class="controls">
    <label class="sr" for="speedSel">Speed</label>
    <select id="speedSel" title="Game speed">
      <option value="slow" selected>Slow</option>
      <option value="normal">Normal</option>
      <option value="fast">Fast</option>
      <option value="instant">Instant</option>
    </select>
    <button class="btn" type="button" data-action="rules">Rules</button>
    <button class="btn" type="button" data-action="new-game">New game</button>
    <button class="btn" type="button" data-action="toggle-debug">Debug</button>
  </div>
</header>

<div class="layout">
  <main class="table" id="table" aria-live="polite">
    <section class="seat seat-west" id="seat1"></section>
    <section class="center" id="center"></section>
    <section class="seat seat-east" id="seat2"></section>
    <section class="me" id="seat0"></section>
  </main>
  <aside class="logpanel">
    <h2>Table log</h2>
    <ol class="gamelog" id="gameLog"></ol>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="assertive"></div>
<div class="overlay" id="overlay" hidden></div>

<div class="debug" id="debugPanel" hidden>
  <header class="dbg-top">
    <strong>Debug</strong>
    <span class="dbg-seed">Seed <code id="dbgSeed"></code> <button class="btn btn-sm" type="button" data-action="copy-seed">Copy</button> <span class="k-hint" id="dbgCopied" aria-live="polite"></span></span>
    <button class="btn dbg-close" type="button" data-action="toggle-debug" aria-label="Close the debug panel">✕ Close</button>
  </header>
  <div class="dbg-section dbg-row">
    <label><input type="checkbox" id="dbgEnable"> Logging</label>
    <label><input type="checkbox" id="dbgAutoplay"> AI plays my seat</label>
  </div>
  <div class="dbg-section" id="dbgThinking">
    <strong>AI thinking</strong>
    <label title="How many guesses about the hidden cards the bots make for each decision. Default 10.">Hunches <input type="number" id="dbgWorlds" min="1" max="200" step="1" value="10" style="width:5em"> <span class="k-hint">per decision (default 10)</span></label>
    <label title="How often the bots imagine a random card when they replay a hand in their heads. Default 30%.">Brain farts <input type="range" id="dbgSkill" min="0" max="100" step="10" value="30"> <output id="dbgSkillOut">30%</output></label>
    <span class="k-hint">Both settings change how long the bots think.</span>
  </div>
  <div class="dbg-section" id="dbgKnowledge">
    <strong>AI knowledge</strong>
    <label title="Remember which suits each player has shown that they are out of (could not follow suit)"><input type="checkbox" data-knowledge="voids" checked> <span class="k-name">Spots voids</span></label>
    <label title="Remember which cards it put in the outside pile"><input type="checkbox" data-knowledge="ownDiscards" checked> <span class="k-name">Remembers discards</span></label>
    <label title="Also test the duck and balance plans. Off: greedy play only"><input type="checkbox" data-knowledge="showdownPlans" checked> <span class="k-name">Plans showdowns</span></label>
    <label title="Read each player's bids as evidence about their hand"><input type="checkbox" data-knowledge="bids" checked> <span class="k-name">Reads bids</span></label>
    <label title="Watch the race to 10 more and more as the leading score passes 5. Off: play for points only"><input type="checkbox" data-knowledge="scoreAware" checked> <span class="k-name">Watches score</span></label>
    <label title="Track where the turned card went after the bidding"><input type="checkbox" data-knowledge="turnedCard" checked> <span class="k-name">Tracks upcard</span></label>
  </div>
  <div class="dbg-section dbg-row">
    <button class="btn" type="button" data-action="settings-reset">Defaults</button>
    <span class="k-hint">Resets hunches, brain farts and all switches. A reload also resets them.</span>
  </div>
  <div class="dbg-tests" id="dbgTests" hidden></div>
  <pre id="dbgLog"></pre>
  <footer class="dbg-bottom">
    <button class="btn" type="button" data-action="run-tests">Run self-tests</button>
    <button class="btn" type="button" data-action="clear-log">Clear</button>
  </footer>
</div>

<noscript><p style="padding:16px">This game needs JavaScript.</p></noscript>

<script>
'use strict';
/* =====================================================================
   King Cut-Throat Euchre — single-file implementation.
   Layers (top to bottom): Rules -> RNG -> Logger -> Engine (state machine)
   -> View (information boundary) -> AI -> Render -> Controller -> SelfTest.
   The Engine state object is the only source of truth. The DOM is a
   rendering target only.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. RULES — immutable card model and authoritative rule functions.
   --------------------------------------------------------------------- */
const Rules = (() => {
  const SUITS = Object.freeze(['S', 'H', 'D', 'C']);
  const SYMBOL = Object.freeze({ S: '♠', H: '♥', D: '♦', C: '♣' });
  const SUIT_NAME = Object.freeze({ S: 'Spades', H: 'Hearts', D: 'Diamonds', C: 'Clubs' });
  const COLOR = Object.freeze({ S: 'black', C: 'black', H: 'red', D: 'red' });
  const SAME_COLOR = Object.freeze({ S: 'C', C: 'S', H: 'D', D: 'H' });
  const RANKS = Object.freeze(['7', '8', '9', '10', 'J', 'Q', 'K', 'A']);
  const RANK_VALUE = Object.freeze({ '7': 7, '8': 8, '9': 9, '10': 10, J: 11, Q: 12, K: 13, A: 14 });
  const RANK_NAME = Object.freeze({ '7': 'Seven', '8': 'Eight', '9': 'Nine', '10': 'Ten', J: 'Jack', Q: 'Queen', K: 'King', A: 'Ace' });
  const JOKER = 'JK';
  /* Suit order for hand display; rotating it from trump keeps colors alternating. */
  const DISPLAY_CYCLE = Object.freeze(['S', 'H', 'C', 'D']);

  const CARDS = {};
  const ALL_IDS = [];
  for (const s of SUITS) {
    for (const r of RANKS) {
      const id = r + s;
      CARDS[id] = Object.freeze({ id, rank: r, suit: s, isJoker: false });
      ALL_IDS.push(id);
    }
  }
  CARDS[JOKER] = Object.freeze({ id: JOKER, rank: 'JOKER', suit: null, isJoker: true });
  ALL_IDS.push(JOKER);
  Object.freeze(ALL_IDS);

  function card(id) {
    const c = CARDS[id];
    if (!c) throw new Error('Unknown card id: ' + id);
    return c;
  }
  function isRightBower(id, trump) { const c = card(id); return !!trump && c.rank === 'J' && c.suit === trump; }
  function isLeftBower(id, trump) { const c = card(id); return !!trump && c.rank === 'J' && c.suit === SAME_COLOR[trump]; }
  /* The suit a card belongs to for following and winning. Joker and Left Bower are trump. */
  function getEffectiveSuit(id, trump) {
    const c = card(id);
    if (c.isJoker) return trump || null;
    if (isLeftBower(id, trump)) return trump;
    return c.suit;
  }
  function isTrump(id, trump) { return !!trump && getEffectiveSuit(id, trump) === trump; }
  /* Rank inside the trump suit: Joker 18, Right 17, Left 16, then A..7 by face value. */
  function trumpRank(id, trump) {
    const c = card(id);
    if (c.isJoker) return 18;
    if (isRightBower(id, trump)) return 17;
    if (isLeftBower(id, trump)) return 16;
    return RANK_VALUE[c.rank];
  }
  /* Absolute ordering strength (independent of the led suit). */
  function getCardStrength(id, trump) {
    if (isTrump(id, trump)) return 100 + trumpRank(id, trump);
    const c = card(id);
    if (c.isJoker) return 50; /* only reachable before trump exists */
    return RANK_VALUE[c.rank];
  }
  /* Power of a card inside a specific trick. Off-suit, non-trump cards have zero power. */
  function trickPower(id, leadSuit, trump) {
    if (isTrump(id, trump)) return 200 + trumpRank(id, trump);
    if (leadSuit && getEffectiveSuit(id, trump) === leadSuit) return 100 + RANK_VALUE[card(id).rank];
    return 0;
  }
  function compareCards(a, b, leadSuit, trump) { return trickPower(a, leadSuit, trump) - trickPower(b, leadSuit, trump); }
  function getLeadSuit(plays, trump) { return plays.length ? getEffectiveSuit(plays[0].card, trump) : null; }
  function getTrickWinner(plays, trump) {
    if (!plays.length) throw new Error('Empty trick');
    const leadSuit = getLeadSuit(plays, trump);
    let best = 0;
    for (let i = 1; i < plays.length; i++) {
      if (compareCards(plays[i].card, plays[best].card, leadSuit, trump) > 0) best = i;
    }
    return { index: best, player: plays[best].player, card: plays[best].card, leadSuit };
  }
  function legalCards(hand, leadSuit, trump) {
    if (!leadSuit) return hand.slice();
    const follow = hand.filter(id => getEffectiveSuit(id, trump) === leadSuit);
    return follow.length ? follow : hand.slice();
  }
  function canPlayCard(id, hand, leadSuit, trump) {
    return hand.includes(id) && legalCards(hand, leadSuit, trump).includes(id);
  }
  function isKing(id) { return card(id).rank === 'K'; }
  function cardRole(id, trump) {
    const c = card(id);
    if (c.isJoker) return 'best';
    if (isRightBower(id, trump)) return 'right';
    if (isLeftBower(id, trump)) return 'left';
    if (isTrump(id, trump)) return 'trump';
    return null;
  }
  function shortName(id) {
    const c = card(id);
    return c.isJoker ? 'Joker' : c.rank + SYMBOL[c.suit];
  }
  function displayName(id, trump) {
    const c = card(id);
    if (c.isJoker) return 'Joker (Best Bower)';
    const base = RANK_NAME[c.rank] + ' of ' + SUIT_NAME[c.suit];
    if (isRightBower(id, trump)) return base + ' (Right Bower)';
    if (isLeftBower(id, trump)) return base + ' (Left Bower, counts as ' + SUIT_NAME[trump] + ')';
    return base;
  }
  /* Full derived card data, for rendering and inspection. */
  function describeCard(id, trump) {
    const c = card(id);
    return Object.freeze({
      id, rank: c.rank, nativeSuit: c.suit, effectiveSuit: getEffectiveSuit(id, trump),
      isTrump: isTrump(id, trump), role: cardRole(id, trump),
      displayName: displayName(id, trump), strength: getCardStrength(id, trump)
    });
  }
  function suitOrder(trump) {
    const start = trump ? DISPLAY_CYCLE.indexOf(trump) : 0;
    return [0, 1, 2, 3].map(i => DISPLAY_CYCLE[(start + i) % 4]);
  }
  function sortHand(hand, trump) {
    const order = suitOrder(trump);
    const group = id => {
      const c = card(id);
      if (c.isJoker && !trump) return -1;
      return order.indexOf(getEffectiveSuit(id, trump));
    };
    return hand.slice().sort((a, b) => (group(a) - group(b)) || (getCardStrength(b, trump) - getCardStrength(a, trump)));
  }
  return Object.freeze({
    SUITS, SYMBOL, SUIT_NAME, COLOR, SAME_COLOR, RANKS, RANK_VALUE, RANK_NAME, JOKER, ALL_IDS,
    card, isRightBower, isLeftBower, getEffectiveSuit, isTrump, trumpRank, getCardStrength,
    trickPower, compareCards, getLeadSuit, getTrickWinner, legalCards, canPlayCard, isKing,
    cardRole, shortName, displayName, describeCard, sortHand, suitOrder
  });
})();

/* ---------------------------------------------------------------------
   2. RNG — seedable, deterministic (mulberry32). State lives in game state.
   --------------------------------------------------------------------- */
const RNG = (() => {
  function next(r) {
    let t = (r.s = (r.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function int(r, n) { return Math.floor(next(r) * n); }
  function shuffle(arr, r) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = int(r, i + 1);
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function freshSeed() {
    try {
      const a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] >>> 0;
    } catch (e) {
      return (Date.now() ^ 0x5bd1e995) >>> 0;
    }
  }
  return Object.freeze({ next, int, shuffle, freshSeed });
})();

/* ---------------------------------------------------------------------
   3. LOGGER — one timestamped logger. Off by default. Public info only.
   --------------------------------------------------------------------- */
const Logger = (() => {
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const L = {
    enabled: false,
    t0: now(),
    lines: [],
    listeners: [],
    log(type, data) {
      if (!this.enabled) return;
      const ms = Math.round(now() - this.t0);
      const parts = [];
      if (data) {
        for (const k of Object.keys(data)) {
          if (k === 'type') continue;
          const v = data[k];
          parts.push(k + '=' + (typeof v === 'object' && v !== null ? JSON.stringify(v) : v));
        }
      }
      const line = '[+' + ms + 'ms] ' + type + (parts.length ? ' ' + parts.join(' ') : '');
      this.lines.push(line);
      if (this.lines.length > 1500) this.lines.splice(0, this.lines.length - 1500);
      if (typeof console !== 'undefined') console.debug(line);
      for (const fn of this.listeners) fn(line);
    },
    clear() { this.lines = []; this.t0 = now(); }
  };
  return L;
})();

/* ---------------------------------------------------------------------
   4. ENGINE — authoritative state + explicit, validated transitions.
   --------------------------------------------------------------------- */
const Engine = (() => {
  const R = Rules;
  const P = Object.freeze({
    SETUP: 'setup', HAND_START: 'handStart', DISCARD: 'discard', REVEAL: 'reveal',
    BID1: 'bid1', BID2: 'bid2', EXCHANGE: 'exchange',
    TRICK_PLAY: 'trickPlay', TRICK_DONE: 'trickDone', HAND_SCORE: 'handScore',
    SHOWDOWN_SETUP: 'showdownSetup', SHOWDOWN_DISCARD: 'showdownDiscard',
    SHOWDOWN_PLAY: 'showdownPlay', SHOWDOWN_TRICK_DONE: 'showdownTrickDone', SHOWDOWN_SCORE: 'showdownScore',
    ABANDONED: 'abandoned', JOKER_VOID: 'jokerVoid', GAME_OVER: 'gameOver'
  });
  const C = Object.freeze({
    WIN_SCORE: 10, PLAYERS: 3, MAIN_TRICKS: 7, SHOWDOWN_TRICKS: 5,
    INITIAL_DISCARD: 3, SHOWDOWN_DEAL: 6, SHOWDOWN_DISCARD: 1, OUTSIDE_SIZE: 12
  });
  const ADVANCE_PHASES = Object.freeze([P.TRICK_DONE, P.SHOWDOWN_TRICK_DONE, P.HAND_SCORE, P.SHOWDOWN_SETUP, P.SHOWDOWN_SCORE, P.ABANDONED, P.JOKER_VOID]);
  const PLAY_PHASES = Object.freeze([P.TRICK_PLAY, P.SHOWDOWN_PLAY]);

  function createGame(seed, names) {
    const n = names || ['You', 'West', 'East'];
    const state = {
      version: 0,
      seed: seed >>> 0,
      rng: { s: seed >>> 0 },
      players: [
        { name: n[0], human: true },
        { name: n[1], human: false },
        { name: n[2], human: false }
      ],
      scores: [0, 0, 0],
      dealer: null,
      handNumber: 0,
      phase: P.SETUP,
      gameOver: false,
      winner: null,
      endEvent: null
    };
    resetHand(state);
    return state;
  }

  /* Collect every card back to the deck and clear all per-hand fields. */
  function resetHand(state) {
    state.deck = R.ALL_IDS.slice();
    state.hands = [[], [], []];
    state.kitty = [];
    state.outside = [];
    state.flippedId = null;
    state.flippedBlocked = false;
    state.flippedOut = false;
    state.round = null;
    state.bidTurn = null;
    state.passes = 0;
    state.bidLog = [];
    state.trump = null;
    state.caller = null;
    state.receiver = null;
    state.exchangeCount = 0;
    state.received = [];
    state.pendingDiscard = [false, false, false];
    state.activePlayers = [0, 1, 2];
    state.trick = null;
    state.trickNumber = 0;
    state.totalTricks = C.MAIN_TRICKS;
    state.tricksWon = [0, 0, 0];
    state.trickWinners = [];
    state.wonPile = [];
    state.lastTrick = null;
    state.leader = null;
    state.currentPlayer = null;
    state.showdown = null;
    state.played = [];
    state.playLog = [];
    state.voids = [[], [], []];
    state.memory = [{ out: [] }, { out: [] }, { out: [] }];
    state.handSummary = null;
    /* Per-hand stats for the end-of-hand summary. Points are actual score changes (after the 0 floor). */
    state.handStats = {
      kings: [[], [], []], sdKings: [[], [], []],
      pts: [0, 1, 2].map(() => ({ king: 0, hand: 0, showdown: 0 }))
    };
  }

  const seatAfter = p => (p + 1) % C.PLAYERS;
  function nextActive(state, p) {
    for (let k = 1; k <= C.PLAYERS; k++) {
      const q = (p + k) % C.PLAYERS;
      if (state.activePlayers.includes(q)) return q;
    }
    throw new Error('No active player');
  }

  /* Pure deal: batches 3 / kitty 3 / 4 / 3, clockwise from the dealer's left. */
  function dealCards(deck, dealer) {
    const hands = [[], [], []];
    const kitty = [];
    let i = 0;
    const order = [1, 2, 3].map(k => (dealer + k) % C.PLAYERS);
    const batch = n => { for (const p of order) for (let j = 0; j < n; j++) hands[p].push(deck[i++]); };
    batch(3);
    for (let j = 0; j < 3; j++) kitty.push(deck[i++]);
    batch(4);
    batch(3);
    if (i !== deck.length) throw new Error('Deal did not use the full deck');
    return { hands, kitty };
  }

  function removeCards(hand, ids) {
    for (const id of ids) {
      const k = hand.indexOf(id);
      if (k < 0) throw new Error('Card not in hand: ' + id);
      hand.splice(k, 1);
    }
  }

  function validSeat(p) { return Number.isInteger(p) && p >= 0 && p < C.PLAYERS; }
  function checkCardSet(hand, cards, n) {
    if (!Array.isArray(cards)) return 'cards must be an array';
    if (cards.length !== n) return 'exactly ' + n + ' card(s) required';
    if (new Set(cards).size !== cards.length) return 'duplicate cards';
    for (const id of cards) if (!hand.includes(id)) return 'card not in hand: ' + id;
    return null;
  }

  /* Who must act now. An empty list means the next step is a system step. */
  function actors(state) {
    switch (state.phase) {
      case P.DISCARD: return [0, 1, 2].filter(p => state.pendingDiscard[p]);
      case P.BID1: case P.BID2: return [state.bidTurn];
      case P.EXCHANGE: return [state.receiver];
      case P.TRICK_PLAY: case P.SHOWDOWN_PLAY: return [state.currentPlayer];
      case P.SHOWDOWN_DISCARD: return state.showdown.participants.filter(p => state.showdown.pendingDiscard[p]);
      default: return [];
    }
  }
  function systemAction(state) {
    switch (state.phase) {
      case P.SETUP: return { type: 'START_GAME' };
      case P.HAND_START: return { type: 'DEAL' };
      case P.REVEAL: return { type: 'FLIP' };
      default: return ADVANCE_PHASES.includes(state.phase) ? { type: 'ADVANCE' } : null;
    }
  }

  function validate(state, a) {
    if (!a || typeof a.type !== 'string') return 'malformed action';
    if (state.gameOver) return 'the game is over';
    const ph = state.phase;
    switch (a.type) {
      case 'START_GAME': return ph === P.SETUP ? null : 'not in setup';
      case 'DEAL': return ph === P.HAND_START ? null : 'not at hand start';
      case 'DISCARD':
        if (ph !== P.DISCARD) return 'not in the discard phase';
        if (!validSeat(a.player) || !state.pendingDiscard[a.player]) return 'player has no discard pending';
        return checkCardSet(state.hands[a.player], a.cards, C.INITIAL_DISCARD);
      case 'FLIP': return ph === P.REVEAL ? null : 'not in the reveal phase';
      case 'BID':
        if (ph !== P.BID1) return 'not in round 1';
        if (a.player !== state.bidTurn) return 'not this player\'s turn to bid';
        return typeof a.accept === 'boolean' ? null : 'accept must be boolean';
      case 'NAME':
        if (ph !== P.BID2) return 'not in round 2';
        if (a.player !== state.bidTurn) return 'not this player\'s turn to bid';
        if (a.suit === null) return null;
        if (!R.SUITS.includes(a.suit)) return 'unknown suit';
        return a.suit === R.card(state.flippedId).suit ? 'the turned suit is blocked' : null;
      case 'EXCHANGE':
        if (ph !== P.EXCHANGE) return 'not in the exchange phase';
        if (a.player !== state.receiver) return 'only the receiving player discards now';
        return checkCardSet(state.hands[a.player], a.cards, state.exchangeCount);
      case 'PLAY':
        if (!PLAY_PHASES.includes(ph)) return 'not in trick play';
        if (a.player !== state.currentPlayer) return 'not this player\'s turn';
        if (!R.canPlayCard(a.card, state.hands[a.player], state.trick.leadSuit, state.trump)) return 'illegal card';
        return null;
      case 'SHOWDOWN_DISCARD':
        if (ph !== P.SHOWDOWN_DISCARD) return 'not in the showdown discard';
        if (!validSeat(a.player) || !state.showdown.pendingDiscard[a.player]) return 'player has no showdown discard pending';
        return checkCardSet(state.hands[a.player], [a.card], C.SHOWDOWN_DISCARD);
      case 'ADVANCE': return ADVANCE_PHASES.includes(ph) ? null : 'nothing to advance';
      default: return 'unknown action ' + a.type;
    }
  }

  function dispatch(state, action) {
    const error = validate(state, action);
    if (error) {
      Logger.log('ACTION_REJECTED', { action: action && action.type, error });
      return { ok: false, error, events: [] };
    }
    const events = [];
    HANDLERS[action.type](state, action, events);
    state.version++;
    for (const e of events) Logger.log(e.type, e);
    return { ok: true, events };
  }

  const SCORE_KIND = Object.freeze({
    KING: 'king', SHOWDOWN_KING: 'king', CLEAR_WINNER: 'hand', NAMER_SWEEP: 'hand', NON_NAMER_SWEEP: 'hand',
    SHOWDOWN_WIN: 'showdown', SHOWDOWN_LOSS: 'showdown'
  });

  /* The only way scores change. Victory is checked immediately. */
  function addScore(state, player, delta, reason, events) {
    const old = state.scores[player];
    const next = Math.max(0, old + delta);
    state.scores[player] = next;
    events.push({ type: 'SCORE_CHANGED', player, delta: next - old, requested: delta, reason, score: next });
    if (state.handStats) state.handStats.pts[player][SCORE_KIND[reason]] += next - old;
    if (next >= C.WIN_SCORE && !state.gameOver) {
      state.gameOver = true;
      state.winner = player;
      state.endEvent = { player, reason, phase: state.phase };
      state.phase = P.GAME_OVER;
      state.currentPlayer = null;
      events.push({ type: 'GAME_ENDED', winner: player, reason, scores: state.scores.slice() });
    }
  }

  function callTrump(state, p, suit, round, events) {
    state.trump = suit;
    state.caller = p;
    state.receiver = seatAfter(p);
    let moved;
    if (round === 1) {
      moved = [state.kitty[0]];
      state.outside.push(state.kitty[1], state.kitty[2]);
      state.exchangeCount = 1;
    } else {
      moved = [state.kitty[1], state.kitty[2]];
      state.outside.push(state.kitty[0]);
      state.flippedOut = true;
      state.exchangeCount = 2;
    }
    state.hands[state.receiver].push(...moved);
    state.received = moved.slice();
    state.kitty = [];
    state.bidTurn = null;
    state.phase = P.EXCHANGE;
    events.push({ type: round === 1 ? 'TRUMP_ACCEPTED' : 'TRUMP_NAMED', player: p, suit, round });
    events.push({ type: 'KITTY_TRANSFER', to: state.receiver, count: moved.length, round, publicCard: round === 1 ? moved[0] : null });
  }

  function startTrick(state, events) {
    state.trick = { leader: state.leader, plays: [], leadSuit: null };
    state.currentPlayer = state.leader;
    events.push({ type: 'TRICK_STARTED', number: state.trickNumber, leader: state.leader, showdown: isShowdownActive(state) });
  }
  const isShowdownActive = state => !!(state.showdown && state.showdown.active);

  function resolveTrick(state, events) {
    const sd = isShowdownActive(state);
    const w = R.getTrickWinner(state.trick.plays, state.trump);
    const king = R.isKing(w.card);
    if (sd) { state.showdown.tricksWon[w.player]++; state.showdown.trickWinners.push(w.player); }
    else { state.tricksWon[w.player]++; state.trickWinners.push(w.player); }
    const plays = state.trick.plays.map(x => ({ player: x.player, card: x.card }));
    state.wonPile.push(...plays.map(x => x.card));
    state.trick.plays = [];
    state.lastTrick = { number: state.trickNumber, plays, winner: w.player, card: w.card, leadSuit: w.leadSuit, showdown: sd, king };
    state.leader = w.player;
    state.currentPlayer = null;
    state.phase = sd ? P.SHOWDOWN_TRICK_DONE : P.TRICK_DONE;
    events.push({ type: sd ? 'SHOWDOWN_TRICK_WON' : 'TRICK_WON', number: state.trickNumber, winner: w.player, card: w.card, king });
    if (king) {
      events.push({ type: 'KING_SCORED', player: w.player, card: w.card, number: state.trickNumber, showdown: sd });
      if (state.handStats) state.handStats[sd ? 'sdKings' : 'kings'][w.player].push(w.card);
      addScore(state, w.player, 1, sd ? 'SHOWDOWN_KING' : 'KING', events);
    }
  }

  function scoreHand(state, events) {
    const t = state.tricksWon.slice();
    const sorted = t.slice().sort((a, b) => b - a);
    if (sorted[0] === 3 && sorted[1] === 3 && sorted[2] === 1) {
      const mediator = t.indexOf(1);
      const participants = [0, 1, 2].filter(p => p !== mediator);
      state.showdown = {
        active: false, mediator, participants,
        pendingDiscard: [false, false, false], discards: [],
        tricksWon: [0, 0, 0], trickWinners: [], lead: null
      };
      state.handSummary = { tricks: t, outcome: 'SHOWDOWN', mediator, participants, caller: state.caller };
      state.phase = P.SHOWDOWN_SETUP;
      events.push({ type: 'HAND_SCORED', tricks: t, outcome: 'SHOWDOWN' });
      events.push({ type: 'SHOWDOWN_STARTED', mediator, participants });
      return;
    }
    const max = sorted[0];
    if (sorted[1] === max) throw new Error('Unexpected tie for most tricks: ' + t.join('-'));
    const w = t.indexOf(max);
    let points = 1, outcome = 'CLEAR_WINNER';
    if (max === C.MAIN_TRICKS) {
      if (w === state.caller) { points = 2; outcome = 'NAMER_SWEEP'; }
      else { points = 3; outcome = 'NON_NAMER_SWEEP'; }
    }
    state.handSummary = { tricks: t, outcome, winner: w, points, caller: state.caller };
    state.phase = P.HAND_SCORE;
    events.push({ type: 'HAND_SCORED', tricks: t, outcome, winner: w, points });
    addScore(state, w, points, outcome, events);
  }

  function showdownLeader(state) {
    const parts = state.showdown.participants;
    for (let i = state.trickWinners.length - 1; i >= 0; i--) {
      if (parts.includes(state.trickWinners[i])) return { player: state.trickWinners[i], mainTrick: i + 1 };
    }
    throw new Error('No showdown participant won a main trick');
  }

  function dealShowdown(state, events) {
    const sd = state.showdown;
    const pool = state.outside.splice(0);
    if (pool.length !== C.OUTSIDE_SIZE) throw new Error('Outside pile must hold 12 cards, has ' + pool.length);
    RNG.shuffle(pool, state.rng);
    const first = seatAfter(sd.mediator);
    const second = seatAfter(first);
    for (let i = 0; i < C.SHOWDOWN_DEAL; i++) {
      state.hands[first].push(pool[2 * i]);
      state.hands[second].push(pool[2 * i + 1]);
    }
    sd.active = true;
    state.activePlayers = sd.participants.slice().sort((a, b) => a - b);
    state.voids = [[], [], []];
    state.memory = [{ out: [] }, { out: [] }, { out: [] }];
    for (const p of sd.participants) sd.pendingDiscard[p] = true;
    state.totalTricks = C.SHOWDOWN_TRICKS;
    state.trickNumber = 0;
    state.lastTrick = null;
    state.trick = null;
    state.phase = P.SHOWDOWN_DISCARD;
    events.push({ type: 'SHOWDOWN_DEAL', mediator: sd.mediator, participants: sd.participants.slice(), poolSize: pool.length, each: C.SHOWDOWN_DEAL });

  function scoreShowdown(state, events) {
    const sd = state.showdown;

    const loser = winner === a ? b : a;

        state.passes = 0;

      if (a.suit) { callTrump(state, a.player, a.suit, 2, events); return; }

      events.push({ type: 'BID_PASS', player: a.player, round: 2 });

        state.phase = P.ABANDONED;

      }

    EXCHANGE(state, a, events) {

      state.outside.push(...a.cards);
      state.memory[a.player].out.push(...a.cards);
      events.push({ type: 'EXCHANGE_DISCARD', player: a.player, count: a.cards.length });
      if (state.outside.length !== C.OUTSIDE_SIZE) throw new Error('Outside pile must be 12 before play');

    PLAY(state, a, events) {

      else if (eff !== state.trick.leadSuit && !state.voids[p].includes(state.trick.leadSuit)) state.voids[p].push(state.trick.leadSuit);
      state.trick.plays.push({ player: p, card: a.card });

      state.playLog.push({ player: p, card: a.card });

      state.trick ? state.trick.plays.map(x => x.card) : [], state.wonPile,

/* ---------------------------------------------------------------------
   5. VIEW — the information boundary. Each seat sees only public data
   plus its own hand and its own private memory. AI and Render use this.
   --------------------------------------------------------------------- */
function buildView(state, seat) {
  const R = Rules, P = Engine.P;
  const sd = state.showdown;
  const inPlay = Engine.PLAY_PHASES.includes(state.phase) && state.currentPlayer === seat;
  const hand = state.hands[seat].slice();
  return {
    seat, phase: state.phase, version: state.version, handNumber: state.handNumber,
    players: state.players.map(p => ({ name: p.name, human: p.human })),
    scores: state.scores.slice(), dealer: state.dealer,
    hand,
    handCounts: state.hands.map(h => h.length),
    kittyCount: state.kitty.length,
    flipped: state.flippedId,
    flippedBlocked: state.flippedBlocked,
    flippedOut: state.flippedOut,
    outsideCount: state.outside.length,
    round: state.round, bidTurn: state.bidTurn, bidLog: state.bidLog.map(b => Object.assign({}, b)),
    trump: state.trump, caller: state.caller, receiver: state.receiver, exchangeCount: state.exchangeCount,
    received: seat === state.receiver ? state.received.slice() : [],
    pendingDiscard: state.pendingDiscard.slice(),
    activePlayers: state.activePlayers.slice(),
    currentPlayer: state.currentPlayer, leader: state.leader,
    trickNumber: state.trickNumber, totalTricks: state.totalTricks,
    trick: state.trick ? { leader: state.trick.leader, leadSuit: state.trick.leadSuit, plays: state.trick.plays.map(x => ({ player: x.player, card: x.card })) } : { leader: null, leadSuit: null, plays: [] },
    lastTrick: state.lastTrick ? JSON.parse(JSON.stringify(state.lastTrick)) : null,
    tricksWon: state.tricksWon.slice(), trickWinners: state.trickWinners.slice(),
    showdown: sd ? {
      active: sd.active, mediator: sd.mediator, participants: sd.participants.slice(),
      pendingDiscard: sd.pendingDiscard.slice(), discardCount: sd.discards.length,
      tricksWon: sd.tricksWon.slice(), trickWinners: sd.trickWinners.slice(), lead: sd.lead ? Object.assign({}, sd.lead) : null
    } : null,
    played: state.played.slice(),
    playLog: state.playLog.map(x => ({ player: x.player, card: x.card })),
    voids: state.voids.map(v => v.slice()),
    myOut: state.memory[seat].out.slice(),
    handSummary: state.handSummary ? JSON.parse(JSON.stringify(state.handSummary)) : null,
    handStats: state.handStats ? JSON.parse(JSON.stringify(state.handStats)) : null,
    gameOver: state.gameOver, winner: state.winner, endEvent: state.endEvent ? Object.assign({}, state.endEvent) : null,
    legal: inPlay ? R.legalCards(hand, state.trick.leadSuit, state.trump) : []
  };
}

/* ---------------------------------------------------------------------
   6. AI — planning opponents. Input: a View only (no hidden data).
   For each decision the AI:
   1. samples deals of the cards it cannot see ("worlds") that agree with
      everything its seat knows: card counts, its own discards, the turned
      card, known voids, and what each player's bids show;
   2. plays each candidate action to the end of the hand in every world with
      the real Engine (a 3-3-1 split plays the Showdown from that world's
      outside pile);
   3. scores each result as its chance to win the game, from a win-chance
      table over all score positions. A game that ends in the play-out counts
      as a win (1) or a loss (0).

const AI = (() => {
  const R = Rules, P = Engine.P, WIN = Engine.C.WIN_SCORE;
  const TRUMP_VAL = { 18: 1.0, 17: 0.93, 16: 0.86, 14: 0.76, 13: 0.66, 12: 0.54, 10: 0.45, 9: 0.40, 8: 0.36, 7: 0.32 };

       otherwise the card is a random legal card. Lower values make the AI judge moves less well. */

  const THINKING_FULL = Object.freeze({ worlds: SAMPLES.play, playoutSkill: 1 });
  const thinking = Object.assign({}, THINKING_DEFAULTS);
  function setThinking(t) {
    if (typeof t.worlds === 'number' && isFinite(t.worlds)) thinking.worlds = Math.min(200, Math.max(1, Math.round(t.worlds)));
    if (typeof t.playoutSkill === 'number' && isFinite(t.playoutSkill)) thinking.playoutSkill = Math.min(1, Math.max(0, t.playoutSkill));
    return Object.assign({}, thinking);
  }
  const TERMINAL = new Set([P.HAND_SCORE, P.SHOWDOWN_SCORE, P.ABANDONED, P.JOKER_VOID, P.GAME_OVER]);

  const KNOWLEDGE_DEFAULTS = Object.freeze({
    bids: false,          /* read each player's bids as evidence about their hand */
    turnedCard: false,    /* track where the turned card went after the bidding */
    ownDiscards: false,   /* remember which cards it put in the outside pile */
    voids: false,         /* use the voids that players showed */
    scoreAware: true,     /* watch the race to 10 as the leading score passes 5 (off: points only) */
    showdownPlans: false  /* also test the duck and balance plans (off: greedy only) */
  });
  const KNOWLEDGE_ALL_ON = Object.freeze({ bids: true, turnedCard: true, ownDiscards: true, voids: true, scoreAware: true, showdownPlans: true });
  const knowledge = Object.assign({}, KNOWLEDGE_DEFAULTS);
  function setKnowledge(k) {
    for (const key of Object.keys(KNOWLEDGE_DEFAULTS)) if (typeof k[key] === 'boolean') knowledge[key] = k[key];
    return Object.assign({}, knowledge);
  }

  /* ---- Win-chance table ----
     Score change in one hand as unordered triples, with counts from 16,555 simulated hands.
     Each triple applies to the seats in every order with equal chance. */
  const HAND_DELTAS = [
    [[2, 0, 0], 5115], [[1, 0, 0], 4054], [[1, 1, 0], 3815], [[2, 1, 0], 1442], [[3, 0, 0], 1018],
    [[2, 0, -1], 243], [[1, 1, 1], 239], [[1, 0, -1], 124], [[4, 0, 0], 113], [[2, 2, 0], 73],
    [[2, 1, 1], 70], [[3, 0, -1], 68], [[1, 1, -1], 60], [[3, 1, 0], 49], [[2, 1, -1], 44],
    [[3, 1, -1], 15], [[4, 0, -1], 4], [[5, 0, 0], 3], [[3, 2, 0], 3], [[2, 2, 1], 2], [[3, 1, 1], 1]
  ];
  let winTable = null;
  const tableIndex = (a, b, c) => ((a * WIN + b) * WIN + c) * 3;
  function uniquePerms(d) {
    const out = new Map();
    for (const q of [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]]) {
      const v = q.map(i => d[i]);

  }
  /* Value iteration over all 1,000 positions below 10. */
  function buildWinTable() {
    const deltas = [];

    for (const [, c] of HAND_DELTAS) total += c;
    for (const [d, c] of HAND_DELTAS) {
      const perms = uniquePerms(d);
      for (const q of perms) deltas.push([q, c / perms.length / total]);

    const D0 = deltas.map(x => x[0][0]), D1 = deltas.map(x => x[0][1]), D2 = deltas.map(x => x[0][2]), PR = deltas.map(x => x[1]);
    const n = deltas.length;

          const top = Math.max(x, y, z);
