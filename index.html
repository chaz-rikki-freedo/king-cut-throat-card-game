      if (mode === 'select') return cardHTML(id, v.trump, { button: true, cls: ['selectable'].concat(ui.selected.has(id) ? ['selected'] : []), isNew });
      if (mode === 'play') {
        const legal = v.legal.includes(id);
        return cardHTML(id, v.trump, { button: true, disabled: !legal, cls: legal ? ['legal'] : ['illegal'] });
      }
      return cardHTML(id, v.trump, { button: true, disabled: true, cls: ['idle'], isNew });
    }).join('');
    return '<div class="hand" id="hand">' + cards + '</div>';
  }

  function render(v, ui, ctx) {
    const table = $('table');
    table.classList.toggle('showdown', !!(v.showdown && (v.showdown.active || v.phase === P.SHOWDOWN_SETUP)));
    $('trumpChip').innerHTML = v.trump ? 'Trump: ' + suitLabel(v.trump) : 'Trump: —';
    for (const p of [1, 2]) {
      const el = $('seat' + p);
      el.innerHTML = seatHTML(v, p, ctx);
      el.classList.toggle('turn', isTurn(v, p));
      el.classList.toggle('out', !!(v.showdown && v.showdown.active && !v.showdown.participants.includes(p)));
    }
    let center = '';
    if (v.showdown && (v.showdown.active || v.phase === P.SHOWDOWN_SETUP)) {
      const parts = v.showdown.participants.map(p => v.players[p].name).join(' vs ');
      center += '<div class="banner">SHOWDOWN<small>' + parts + ' · mediator: ' + v.players[v.showdown.mediator].name + '</small></div>';
    }
    center += pilesHTML(v);
    const summary = summaryText(v);
    if (summary) center += summary;
    else if (Engine.PLAY_PHASES.includes(v.phase) || v.phase === P.TRICK_DONE || v.phase === P.SHOWDOWN_TRICK_DONE || (v.phase === P.GAME_OVER && v.lastTrick)) center += trickHTML(v, ctx);
    center += '<div class="status">' + statusText(v) + '</div>' + lastTrickHTML(v);
    $('center').innerHTML = center;

    const me = $('seat0');
    const flash = ctx.flashSeats.has(v.seat) ? ' flash' : '';
    me.innerHTML = '<div class="me-head"><span class="seat-name">' + v.players[v.seat].name + '</span>' + badges(v, v.seat) +
      '<span class="score' + flash + '">' + v.scores[v.seat] + '<small> / 10</small></span>' + tricksLine(v, v.seat) + bidBubble(v, v.seat) + '</div>' +
      '<div class="actionbar">' + actionBarHTML(v, ui, ctx) + '</div>' + handHTML(v, ui);
    me.classList.toggle('turn', isTurn(v, v.seat));
  }

  return Object.freeze({ render, cardHTML, statusText, isTurn, youText, CONTINUE_LABEL });
})();

/* ---------------------------------------------------------------------
   8. CONTROLLER — game flow, timing, and human input.
   Timers only pace the display. Each timer checks the state version so a
   stale timer can never act on a newer state.
   --------------------------------------------------------------------- */
const App = (() => {
  const R = Rules, P = Engine.P;
  const DELAYS = {
    slow: { ai: 1200, trick: 2300, sys: 600 },
    normal: { ai: 650, trick: 1400, sys: 350 },
    fast: { ai: 220, trick: 650, sys: 120 },
    instant: { ai: 0, trick: 0, sys: 0 }
  };
  const HUMAN = 0;
  const app = {
    state: null,
    ui: { selected: new Set(), selKey: '', speed: 'normal', autoplay: false },
    timer: null, timerFn: null, lastEvents: []
  };
  const $ = id => document.getElementById(id);
  const safe = fn => { try { return fn(); } catch (e) { return null; } };

  function newGame(seed) {
    clearTimer();
    const s = (seed === undefined || seed === null) ? RNG.freshSeed() : (seed >>> 0);
    app.state = Engine.createGame(s);
    app.ui.selected.clear();
    $('gameLog').innerHTML = '';
    $('overlay').hidden = true;
    const dbgSeed = $('dbgSeed');
    if (dbgSeed) dbgSeed.textContent = 'seed ' + s;
    addLog('New game (seed ' + s + ').', '');
    act({ type: 'START_GAME' });
  }

  function act(action) {
    const res = Engine.dispatch(app.state, action);
    if (!res.ok) { draw([]); return res; }
    app.lastEvents = res.events;
    for (const e of res.events) narrate(e);
    draw(res.events);
    schedule();
    return res;
  }

  function clearTimer() {
    if (app.timer) clearTimeout(app.timer);
    app.timer = null; app.timerFn = null;
  }
  function later(ms, fn) {
    clearTimer();
    const version = app.state.version;
    app.timerFn = () => { app.timer = null; app.timerFn = null; if (app.state.version === version) fn(); };
    app.timer = setTimeout(app.timerFn, ms);
  }
  function skip() { if (app.timerFn) { const f = app.timerFn; clearTimeout(app.timer); f(); } }

  function schedule() {
    clearTimer();
    const st = app.state;
    if (st.gameOver) { showGameOver(); return; }
    const d = DELAYS[app.ui.speed];
    const actors = Engine.actors(st);
    const ai = actors.filter(p => !st.players[p].human || (app.ui.autoplay && p === HUMAN));
    if (ai.length) {
      const p = ai[0];
      later(d.ai, () => act(AI.decide(buildView(app.state, p))));
    } else if (!actors.length) {
      const sys = Engine.systemAction(st);
      if (!sys) return;
      const manual = !!Render.CONTINUE_LABEL[st.phase];
      if (manual && !app.ui.autoplay) return; /* wait for the Continue button */
      const ms = (st.phase === P.TRICK_DONE || st.phase === P.SHOWDOWN_TRICK_DONE || manual) ? d.trick : d.sys;
      later(ms, () => act(sys));
    }
    draw([]);
  }

  function selectionKey(v) { return v.phase + ':' + v.handNumber + ':' + (v.showdown ? 'sd' : '') + ':' + v.receiver; }

  function draw(events) {
    const v = buildView(app.state, HUMAN);
    const key = selectionKey(v);
    if (key !== app.ui.selKey) { app.ui.selected.clear(); app.ui.selKey = key; }
    for (const id of Array.from(app.ui.selected)) if (!v.hand.includes(id)) app.ui.selected.delete(id);
    const ctx = { flashSeats: new Set(), newCards: new Set(), waiting: !!app.timerFn };
    for (const e of events) {
      if (e.type === 'SCORE_CHANGED' && e.delta !== 0) ctx.flashSeats.add(e.player);
      if (e.type === 'CARD_PLAYED') ctx.newCards.add(e.card);
    }
    Render.render(v, app.ui, ctx);
  }

  /* ---- Narration: public events -> human-readable log + toasts ---- */
  function addLog(text, cls) {
    const li = document.createElement('li');
    li.textContent = Render.youText(text);
    if (cls) li.className = cls;
    const ol = $('gameLog');
    ol.appendChild(li);
    while (ol.children.length > 400) ol.removeChild(ol.firstChild);
    ol.scrollTop = ol.scrollHeight;
  }
  function toast(text, cls) {
    const t = document.createElement('div');
    t.className = 'toast' + (cls ? ' ' + cls : '');
    t.textContent = Render.youText(text);
    const box = $('toasts');
    box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => t.remove(), 2700);
  }
  const REASON = {
    KING: 'King won a trick', SHOWDOWN_KING: 'King won a Showdown trick', CLEAR_WINNER: 'most tricks',
    NAMER_SWEEP: 'namer sweep', NON_NAMER_SWEEP: 'non-namer sweep', SHOWDOWN_WIN: 'won the Showdown', SHOWDOWN_LOSS: 'lost the Showdown'
  };
  function narrate(e) {
    const st = app.state;
    const n = p => st.players[p].name;
    switch (e.type) {
      case 'DEAL': addLog('Hand ' + e.hand + ': ' + n(e.dealer) + ' deals 10 cards to each player and 3 to the kitty.', 'h'); break;
      case 'DISCARD': addLog(n(e.player) + ' discards 3 cards to the outside pile.', ''); break;
      case 'KITTY_FLIPPED': addLog(n(st.dealer) + ' turns up ' + R.shortName(e.card) + '.', ''); break;
      case 'HAND_VOID': addLog('The Joker was turned. The hand is void and will be dealt again.', 'h'); toast('Joker turned — redeal', 'info'); break;
      case 'BID_PASS': addLog(n(e.player) + ' passes (round ' + e.round + ').', ''); break;
      case 'BIDDING_ROUND': if (e.round === 2) addLog('Round 2: ' + R.SUIT_NAME[e.blocked] + ' is blocked. Players may name another suit.', ''); break;
      case 'TRUMP_ACCEPTED': addLog(n(e.player) + ' accepts ' + R.SUIT_NAME[e.suit] + ' as trump.', 'h'); toast(n(e.player) + ' accepts ' + R.SYMBOL[e.suit] + ' trump', 'info'); break;
      case 'TRUMP_NAMED': addLog(n(e.player) + ' names ' + R.SUIT_NAME[e.suit] + ' as trump.', 'h'); toast(n(e.player) + ' names ' + R.SYMBOL[e.suit] + ' trump', 'info'); break;
      case 'KITTY_TRANSFER': addLog((e.publicCard ? R.shortName(e.publicCard) : 'The 2 face-down kitty cards') + ' go' + (e.publicCard ? 'es' : '') + ' to ' + n(e.to) + ' (left of the namer).', ''); break;
      case 'EXCHANGE_DISCARD': addLog(n(e.player) + ' discards ' + e.count + ' to the outside pile.', ''); break;
      case 'HAND_ABANDONED': addLog('Everyone passed twice. The hand is abandoned.', 'h'); break;
      case 'TRICK_STARTED': if (e.number === 1) addLog((e.showdown ? 'Showdown' : 'Play') + ' begins. ' + n(e.leader) + ' leads.', ''); break;
      case 'CARD_PLAYED': addLog(n(e.player) + ' plays ' + R.shortName(e.card) + '.', ''); break;
      case 'TRICK_WON': case 'SHOWDOWN_TRICK_WON': addLog(n(e.winner) + ' wins ' + (e.type === 'SHOWDOWN_TRICK_WON' ? 'Showdown ' : '') + 'trick ' + e.number + ' with ' + R.shortName(e.card) + '.', ''); break;
      case 'KING_SCORED': addLog('♔ +1 to ' + n(e.player) + ': ' + R.shortName(e.card) + ' won the trick.', 'k'); toast('♔ +1 ' + n(e.player) + ' — ' + R.shortName(e.card) + ' wins the trick!'); break;
      case 'SCORE_CHANGED':
        if (e.reason !== 'KING' && e.reason !== 'SHOWDOWN_KING') {
          const sign = e.delta > 0 ? '+' + e.delta : (e.delta < 0 ? '−' + (-e.delta) : (e.requested < 0 ? '−0' : '0'));
          addLog(sign + ' to ' + n(e.player) + ' (' + REASON[e.reason] + (e.requested < 0 && e.delta === 0 ? ', already at 0' : '') + '). Score: ' + e.score + '.', e.delta < 0 || e.requested < 0 ? 's' : 'k');
          toast(sign + ' ' + n(e.player) + ' — ' + REASON[e.reason], e.requested < 0 ? 'neg' : '');
        }
        break;
      case 'HAND_SCORED': addLog('Hand tricks: ' + st.players.map((p, i) => p.name + ' ' + e.tricks[i]).join(', ') + '.', 'h'); break;
      case 'SHOWDOWN_STARTED': addLog('SHOWDOWN! ' + n(e.participants[0]) + ' and ' + n(e.participants[1]) + ' tied 3–3. ' + n(e.mediator) + ' is the mediator.', 's'); toast('SHOWDOWN!', 'neg'); break;
      case 'SHOWDOWN_DEAL': addLog(n(e.mediator) + ' shuffles the 12 outside cards and deals 6 to each Showdown player.', 's'); break;
      case 'SHOWDOWN_DISCARD': addLog(n(e.player) + ' discards 1 Showdown card.', ''); break;
      case 'SHOWDOWN_LEAD': addLog(n(e.player) + ' leads the Showdown (won main trick ' + e.mainTrick + ', the latest by a Showdown player).', 's'); break;
      case 'SHOWDOWN_SCORED': addLog('Showdown tricks: ' + n(e.winner) + ' ' + e.tricks[e.winner] + ', ' + n(e.loser) + ' ' + e.tricks[e.loser] + '.', 's'); break;
      case 'GAME_ENDED': addLog('🏆 ' + n(e.winner) + ' reaches ' + e.scores[e.winner] + ' points and wins the game.', 'w'); break;
      case 'DEALER_ROTATED': addLog('The deal passes to ' + n(e.dealer) + '.', ''); break;
      case 'REDEAL': addLog(n(e.dealer) + ' deals again.', ''); break;
      default: break;
    }
  }

  function showGameOver() {
    const st = app.state;
    const v = buildView(st, HUMAN);
    const n = p => v.players[p].name;
    const how = {
      KING: 'a King won a trick', SHOWDOWN_KING: 'a King won a Showdown trick', CLEAR_WINNER: 'taking the most tricks',
      NAMER_SWEEP: 'a namer sweep', NON_NAMER_SWEEP: 'a non-namer sweep', SHOWDOWN_WIN: 'winning the Showdown'
    }[v.endEvent.reason] || v.endEvent.reason;
    const rows = [0, 1, 2].slice().sort((a, b) => v.scores[b] - v.scores[a]).map(p => '<tr><td>' + n(p) + (p === v.winner ? ' 🏆' : '') + '</td><td>' + v.scores[p] + '</td></tr>').join('');
    const ov = $('overlay');
    ov.innerHTML = '<div class="modal" role="dialog" aria-label="Game over"><div class="big">' + (v.winner === HUMAN ? 'You win!' : n(v.winner) + ' wins!') + '</div>' +
      '<p>' + Render.youText('The game ended at once, in hand ' + v.handNumber + ', by ' + how + '.') + '</p><table><tr><th>Player</th><th>Score</th></tr>' + rows + '</table>' +
      '<div class="row"><button class="btn" type="button" data-action="close-overlay">View table</button><button class="btn primary" type="button" data-action="new-game-now">Play again</button></div></div>';
    ov.hidden = false;
  }

  function showRules() {
    const ov = $('overlay');
    ov.innerHTML = '<div class="modal" role="dialog" aria-label="Rules"><h2>King Cut-Throat Euchre — quick rules</h2><ul>' +
      '<li>3 players, every player for themselves. First to <b>10 points</b> wins at once, even mid-trick.</li>' +
      '<li>33-card deck: 7–A in four suits plus the Joker. Deal: 3 each, 3 to the kitty, 4 each, 3 each.</li>' +
      '<li>Trump order: Joker, Right Bower (Jack of trump), Left Bower (other Jack of the same color, counts as trump), A, K, Q, 10, 9, 8, 7.</li>' +
      '<li>Before bidding, everyone discards 3 face-down to the outside pile (7 cards left).</li>' +
      '<li>Round 1: the dealer turns the top kitty card (a Joker voids the hand). Accept its suit or pass. If accepted, the turned card goes to the player <b>left of the caller</b>, who discards 1.</li>' +
      '<li>Round 2: name another suit or pass. If named, the 2 face-down kitty cards go to the player left of the caller, who discards 2. If all pass, the hand is abandoned.</li>' +
      '<li>7 tricks. The player left of the dealer leads. Follow suit if you can.</li>' +
      '<li><b>King points:</b> +1 at once when a King wins a trick. A losing King scores nothing.</li>' +
      '<li>End of hand: most tricks +1 · namer takes all 7: +2 · non-namer takes all 7: +3. There is no euchre penalty.</li>' +
      '<li><b>Showdown:</b> on a 3–3–1 split, the 1-trick player mediates, shuffles the 12 outside cards and deals 6 to each tied player. Each discards 1 and they play 5 tricks with the same trump. The player who won the latest main trick between them leads. Winner +1, loser −1 (not below 0).</li>' +
      '</ul><div class="row"><button class="btn primary" type="button" data-action="close-overlay">Close</button></div></div>';
    ov.hidden = false;
  }

  /* ---- Human input. Engine.validate is the final guard for every action. ---- */
  function onCard(id) {
    const v = buildView(app.state, HUMAN);
    if (app.ui.autoplay) return;
    const sel = app.ui.selected;
    let limit = 0;
    if (v.phase === P.DISCARD && v.pendingDiscard[HUMAN]) limit = 3;
    else if (v.phase === P.EXCHANGE && v.receiver === HUMAN) limit = v.exchangeCount;
    else if (v.phase === P.SHOWDOWN_DISCARD && v.showdown.pendingDiscard[HUMAN]) limit = 1;
    if (limit) {
      if (sel.has(id)) sel.delete(id);
      else if (limit === 1) { sel.clear(); sel.add(id); }
      else if (sel.size < limit) sel.add(id);
      draw([]);
      return;
    }
    if (Engine.PLAY_PHASES.includes(v.phase) && v.currentPlayer === HUMAN && v.legal.includes(id)) {
      act({ type: 'PLAY', player: HUMAN, card: id });
    }
  }

  function onAction(name, el) {
    const sel = Array.from(app.ui.selected);
    switch (name) {
      case 'confirm-discard': act({ type: 'DISCARD', player: HUMAN, cards: sel }); break;
      case 'confirm-exchange': act({ type: 'EXCHANGE', player: HUMAN, cards: sel }); break;
      case 'confirm-sd-discard': act({ type: 'SHOWDOWN_DISCARD', player: HUMAN, card: sel[0] }); break;
      case 'bid-accept': act({ type: 'BID', player: HUMAN, accept: true }); break;
      case 'bid-pass': act({ type: 'BID', player: HUMAN, accept: false }); break;
      case 'name-suit': act({ type: 'NAME', player: HUMAN, suit: el.getAttribute('data-suit') }); break;
      case 'name-pass': act({ type: 'NAME', player: HUMAN, suit: null }); break;
      case 'continue': { const sys = Engine.systemAction(app.state); if (sys) act(sys); break; }
      case 'skip': skip(); break;
      case 'rules': showRules(); break;
      case 'close-overlay': $('overlay').hidden = true; break;
      case 'new-game':
        if (app.state.gameOver || app.state.handNumber <= 1 || window.confirm('Abandon this game and start a new one?')) newGame();
        break;
      case 'new-game-now': newGame(); break;
      case 'toggle-debug': { const d = $('debugPanel'); d.hidden = !d.hidden; break; }
      case 'clear-log': Logger.clear(); $('dbgLog').textContent = ''; break;
      case 'run-tests': {
        const res = SelfTest.run();
        const out = res.results.filter(r => !r.ok).map(r => 'FAIL ' + r.name + (r.detail ? ' — ' + r.detail : '')).join('\n');
        $('dbgLog').textContent += '\n=== Self-tests: ' + res.passed + ' passed, ' + res.failed + ' failed (' + res.ms + 'ms) ===\n' + (out || 'All tests passed.') + '\n';
        break;
      }
      default: break;
    }
  }

  function init() {
    document.addEventListener('click', ev => {
      const cardEl = ev.target.closest('button[data-card]');
      if (cardEl && !cardEl.disabled) { onCard(cardEl.getAttribute('data-card')); return; }
      const a = ev.target.closest('[data-action]');
      if (a && !a.disabled) { onAction(a.getAttribute('data-action'), a); return; }
      if (ev.target.closest('#table') && app.timerFn) skip();
    });
    document.addEventListener('keydown', ev => {
      if (ev.key !== ' ' && ev.key !== 'Enter') return;
      if (ev.target && /^(BUTTON|SELECT|INPUT)$/.test(ev.target.tagName)) return;
      ev.preventDefault();
      if (app.timerFn) skip();
      else if (Render.CONTINUE_LABEL[app.state.phase]) onAction('continue');
    });
    const speed = $('speedSel');
    const saved = safe(() => localStorage.getItem('kct-speed'));
    if (saved && DELAYS[saved]) { app.ui.speed = saved; speed.value = saved; }
    speed.addEventListener('change', () => { app.ui.speed = speed.value; safe(() => localStorage.setItem('kct-speed', speed.value)); schedule(); });
    const dbg = $('dbgEnable');
    dbg.addEventListener('change', () => { Logger.enabled = dbg.checked; });
    $('dbgAutoplay').addEventListener('change', e => { app.ui.autoplay = e.target.checked; schedule(); });
    Logger.listeners.push(line => { const pre = $('dbgLog'); if (!pre.parentElement.hidden) { pre.textContent += line + '\n'; pre.scrollTop = pre.scrollHeight; } });
    const params = safe(() => new URLSearchParams(location.search)) || new URLSearchParams('');
    if (params.get('debug') === '1') { Logger.enabled = true; dbg.checked = true; $('debugPanel').hidden = false; }
    const seedParam = params.get('seed');
    newGame(seedParam !== null && /^\d+$/.test(seedParam) ? Number(seedParam) : undefined);
  }

  return { init, newGame, act, skip, app };
})();

/* ---------------------------------------------------------------------
   9. SELF-TEST — rule and flow verification. Run from the Debug panel.
   --------------------------------------------------------------------- */
const SelfTest = (() => {
  const R = Rules, P = Engine.P;
  function run(opts) {
    const o = opts || {};
    const results = [];
    const t0 = Date.now();
    const wasLogging = Logger.enabled;
    Logger.enabled = false;
    const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail: ok ? '' : (detail || '') });
    const eq = (name, a, b) => check(name, JSON.stringify(a) === JSON.stringify(b), 'got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b));
    const D = (s, a) => Engine.dispatch(s, a);
    const safeRun = (name, fn) => { try { fn(); } catch (e) { check(name + ' (exception)', false, String(e && e.stack || e)); } };

    /* --- Card mechanics --- */
    safeRun('cards', () => {
      eq('deck has 33 unique cards', new Set(R.ALL_IDS).size, 33);
      const order = ['JK', 'JS', 'JC', 'AS', 'KS', 'QS', '10S', '9S', '8S', '7S'];
      let ok = true;
      for (let i = 1; i < order.length; i++) if (R.compareCards(order[i - 1], order[i], 'S', 'S') <= 0) ok = false;
      check('trump order Joker > Right > Left > A..7', ok);
      eq('10 trump cards when Spades is trump', R.ALL_IDS.filter(id => R.isTrump(id, 'S')).length, 10);
      eq('same-color suit has 7 cards', R.ALL_IDS.filter(id => R.getEffectiveSuit(id, 'S') === 'C').length, 7);
      eq('other suits have 8 cards', R.ALL_IDS.filter(id => R.getEffectiveSuit(id, 'S') === 'H').length, 8);
      eq('Left Bower effective suit is trump', R.getEffectiveSuit('JC', 'S'), 'S');
      eq('Jack of Clubs is a club when Hearts is trump', R.getEffectiveSuit('JC', 'H'), 'C');
      eq('Joker effective suit is trump', R.getEffectiveSuit('JK', 'D'), 'D');
      const off = ['AH', 'KH', 'QH', 'JH', '10H', '9H', '8H', '7H'];
      ok = true;
      for (let i = 1; i < off.length; i++) if (R.compareCards(off[i - 1], off[i], 'H', 'S') <= 0) ok = false;
      check('non-trump order A K Q J 10 9 8 7', ok);
      eq('off-suit high card cannot win', R.getTrickWinner([{ player: 0, card: '7H' }, { player: 1, card: 'AD' }, { player: 2, card: 'KC' }], 'S').player, 0);
      eq('any trump beats the led suit', R.getTrickWinner([{ player: 0, card: 'AH' }, { player: 1, card: '7S' }, { player: 2, card: 'KH' }], 'S').player, 1);
      eq('Left Bower beats Ace of trump', R.getTrickWinner([{ player: 0, card: 'AS' }, { player: 1, card: 'JC' }, { player: 2, card: 'KS' }], 'S').player, 1);
      eq('Joker beats Right Bower', R.getTrickWinner([{ player: 0, card: 'JS' }, { player: 1, card: 'JK' }], 'S').player, 1);
      eq('Right beats Left', R.getTrickWinner([{ player: 0, card: 'JC' }, { player: 1, card: 'JS' }], 'S').player, 1);
      eq('describeCard Left Bower', [R.describeCard('JC', 'S').effectiveSuit, R.describeCard('JC', 'S').nativeSuit, R.describeCard('JC', 'S').role], ['S', 'C', 'left']);
    });

    /* --- Following suit --- */
    safeRun('follow', () => {
      eq('must follow an ordinary suit', R.legalCards(['AH', '7S', 'KC'], 'H', 'S'), ['AH']);
      eq('Left Bower does not follow its native suit', R.legalCards(['JC', '7H', 'AD'], 'C', 'S'), ['JC', '7H', 'AD']);
      eq('Left Bower must follow a trump lead', R.legalCards(['JC', 'AH'], 'S', 'S'), ['JC']);
      eq('Joker must follow a trump lead', R.legalCards(['JK', 'AH'], 'S', 'S'), ['JK']);
      eq('a Left Bower lead is a trump lead', R.getEffectiveSuit('JC', 'S'), 'S');
      eq('follow a Left Bower lead with trump', R.legalCards(['AS', 'KC', 'QC'], R.getEffectiveSuit('JC', 'S'), 'S'), ['AS']);
      eq('void hand can play anything', R.legalCards(['AH', 'KH'], 'D', 'S'), ['AH', 'KH']);
      eq('must follow trump', R.legalCards(['7S', 'AH', 'JK'], 'S', 'S'), ['7S', 'JK']);
      const s = playState([['9H'], ['KH'], ['AH', '7S']], 'S', 1);
      check('engine rejects a card out of turn', !D(s, { type: 'PLAY', player: 0, card: '9H' }).ok);
      check('engine accepts a legal lead', D(s, { type: 'PLAY', player: 1, card: 'KH' }).ok);
      check('engine rejects a revoke (7S while holding AH)', !D(s, { type: 'PLAY', player: 2, card: '7S' }).ok);
      check('engine accepts the legal follow', D(s, { type: 'PLAY', player: 2, card: 'AH' }).ok);
    });

    /* --- Deal --- */
    safeRun('deal', () => {
      const d = Engine.dealCards(R.ALL_IDS.slice(), 0);
      eq('deal batch 1 to dealer\'s left first', d.hands[1].slice(0, 3), R.ALL_IDS.slice(0, 3));
      eq('deal batch 1 then next player', d.hands[2].slice(0, 3), R.ALL_IDS.slice(3, 6));
      eq('deal batch 1 dealer last', d.hands[0].slice(0, 3), R.ALL_IDS.slice(6, 9));
      eq('kitty is batch 2', d.kitty, R.ALL_IDS.slice(9, 12));
      eq('batch 3 is 4 cards', d.hands[1].slice(3, 7), R.ALL_IDS.slice(12, 16));
      eq('batch 4 is 3 cards', d.hands[0].slice(7, 10), R.ALL_IDS.slice(30, 33));
      eq('three 10-card hands', d.hands.map(h => h.length), [10, 10, 10]);
      const s = Engine.createGame(42); D(s, { type: 'START_GAME' }); D(s, { type: 'DEAL' });
      eq('dealt state passes audit', Engine.audit(s), []);
      eq('kitty has 3', s.kitty.length, 3);
    });

    /* --- Bidding --- */
    safeRun('bidding', () => {
      let s = revealState(5, 0, '9H');
      eq('outside has 9 after initial discards', s.outside.length, 9);
      eq('hands have 7 after initial discards', s.hands.map(h => h.length), [7, 7, 7]);
      {
        const d = Engine.createGame(5); D(d, { type: 'START_GAME' }); D(d, { type: 'DEAL' });
        check('2-card initial discard rejected', !D(d, { type: 'DISCARD', player: 0, cards: d.hands[0].slice(0, 2) }).ok);
        check('discard of a card not held rejected', !D(d, { type: 'DISCARD', player: 0, cards: [d.hands[0][0], d.hands[0][1], d.hands[1][0]] }).ok);
        check('duplicate discard rejected', !D(d, { type: 'DISCARD', player: 0, cards: [d.hands[0][0], d.hands[0][0], d.hands[0][1]] }).ok);
        check('flip before discards rejected', !D(d, { type: 'FLIP' }).ok);
      }
      D(s, { type: 'FLIP' });
      eq('round 1 starts left of dealer', [s.phase, s.bidTurn], [P.BID1, 1]);
      check('out-of-turn bid rejected', !D(s, { type: 'BID', player: 2, accept: true }).ok);
      D(s, { type: 'BID', player: 1, accept: true });
      eq('round 1 accept: trump, caller, receiver', [s.trump, s.caller, s.receiver, s.phase], ['H', 1, 2, P.EXCHANGE]);
      check('receiver holds the turned card', s.hands[2].includes('9H') && s.hands[2].length === 8);
      eq('caller hand unchanged', s.hands[1].length, 7);
      eq('2 unseen kitty cards to outside', s.outside.length, 11);
      check('exchange with wrong count rejected', !D(s, { type: 'EXCHANGE', player: 2, cards: s.hands[2].slice(0, 2) }).ok);
      check('exchange by non-receiver rejected', !D(s, { type: 'EXCHANGE', player: 1, cards: s.hands[1].slice(0, 1) }).ok);
      D(s, { type: 'EXCHANGE', player: 2, cards: [s.hands[2][0]] });
      eq('after exchange: outside 12, hands 7, play', [s.outside.length, s.hands.map(h => h.length), s.phase, s.currentPlayer], [12, [7, 7, 7], P.TRICK_PLAY, 1]);
      eq('audit after round 1', Engine.audit(s), []);

      s = revealState(6, 0, '9H');
      D(s, { type: 'FLIP' });
      const k1 = s.kitty[1], k2 = s.kitty[2];
      D(s, { type: 'BID', player: 1, accept: false }); D(s, { type: 'BID', player: 2, accept: false }); D(s, { type: 'BID', player: 0, accept: false });
      eq('all pass round 1 -> round 2, suit blocked', [s.phase, s.flippedBlocked, s.bidTurn], [P.BID2, true, 1]);
      check('naming the blocked suit is rejected', !D(s, { type: 'NAME', player: 1, suit: 'H' }).ok);
      D(s, { type: 'NAME', player: 1, suit: null });
      D(s, { type: 'NAME', player: 2, suit: 'S' });
      eq('round 2 naming: caller 2, receiver 0', [s.trump, s.caller, s.receiver], ['S', 2, 0]);
      check('receiver gets the 2 face-down kitty cards', s.hands[0].includes(k1) && s.hands[0].includes(k2) && s.hands[0].length === 9);
      check('turned card goes to the outside pile', s.outside.includes('9H') && s.outside.length === 10);
      D(s, { type: 'EXCHANGE', player: 0, cards: s.hands[0].slice(0, 2) });
      eq('round 2 exchange -> 12 outside', [s.outside.length, s.hands.map(h => h.length)], [12, [7, 7, 7]]);
      eq('audit after round 2', Engine.audit(s), []);

      s = revealState(7, 2, '9H');
      D(s, { type: 'FLIP' });
      eq('round 1 starts left of dealer 2', s.bidTurn, 0);
      for (const p of [0, 1, 2]) D(s, { type: 'BID', player: p, accept: false });
      D(s, { type: 'NAME', player: 0, suit: 'D' });
      eq('receiver wraps (caller 0 -> receiver 1)', s.receiver, 1);

      s = revealState(8, 1, '9H');
      D(s, { type: 'FLIP' });
      for (const p of [2, 0, 1]) D(s, { type: 'BID', player: p, accept: false });
      for (const p of [2, 0, 1]) D(s, { type: 'NAME', player: p, suit: null });
      eq('all pass round 2 -> abandoned', s.phase, P.ABANDONED);
      D(s, { type: 'ADVANCE' });
      eq('abandoned: deal passes left', [s.phase, s.dealer], [P.HAND_START, 2]);
      eq('abandoned: all cards collected', Engine.audit(s), []);

      s = revealState(9, 1, 'JK');
      D(s, { type: 'FLIP' });
      eq('Joker turned -> void', s.phase, P.JOKER_VOID);
      D(s, { type: 'ADVANCE' });
      eq('Joker redeal keeps dealer', [s.phase, s.dealer], [P.HAND_START, 1]);
      eq('redeal collects all cards', Engine.audit(s), []);
    });

    /* --- Trick scoring --- */
    /* --- AI card memory --- */
    safeRun('ai memory', () => {
      const s = revealState(5, 0, '9H');
      D(s, { type: 'FLIP' });
      D(s, { type: 'BID', player: 1, accept: true });
      D(s, { type: 'EXCHANGE', player: 2, cards: [s.hands[2].find(id => id !== '9H')] });
      const v0 = buildView(s, 0);
      eq('turned card is located at the receiver', AI.locatedCards(v0), [[], [], ['9H']]);
      eq('receiver does not locate its own card', AI.locatedCards(buildView(s, 2)), [[], [], []]);
      eq('a played turned card is not located', AI.locatedCards(Object.assign({}, v0, { played: ['9H'] })), [[], [], []]);
      eq('a void in trump clears the located card', AI.locatedCards(Object.assign({}, v0, { voids: [[], [], ['H']] })), [[], [], []]);
      const n = revealState(6, 0, '9H');
      D(n, { type: 'FLIP' });
      for (const p of [1, 2, 0]) D(n, { type: 'BID', player: p, accept: false });
      D(n, { type: 'NAME', player: 1, suit: 'S' });
      eq('round 2: no located cards', AI.locatedCards(buildView(n, 0)), [[], [], []]);
    });

    safeRun('scoring', () => {
      let s = playState([['KH'], ['7H'], ['9H']], 'S', 0);
      playAll(s, [[0, 'KH'], [1, '7H'], [2, '9H']]);
      eq('winning King scores +1 at once', s.scores, [1, 0, 0]);
      s = playState([['KH'], ['AH'], ['9H']], 'S', 0);
      playAll(s, [[0, 'KH'], [1, 'AH'], [2, '9H']]);
      eq('losing King scores 0; capturing Ace scores 0', s.scores, [0, 0, 0]);
      s = playState([['KH'], ['7S'], ['9H']], 'S', 0);
      playAll(s, [[0, 'KH'], [1, '7S'], [2, '9H']]);
      eq('trump capturing a King scores 0', [s.scores, s.tricksWon], [[0, 0, 0], [0, 1, 0]]);
      s = playState([['7S'], ['KS'], ['9H']], 'S', 0);
      playAll(s, [[0, '7S'], [1, 'KS'], [2, '9H']]);
      eq('trump King wins and scores', s.scores, [0, 1, 0]);
      s = playState([['KD'], ['KH'], ['7C']], 'S', 2);
      playAll(s, [[2, '7C'], [0, 'KD'], [1, 'KH']]);
      eq('off-suit King that does not win scores 0', s.scores, [0, 0, 0]);

      s = playState([['KH', 'AH'], ['7H', '8H'], ['9H', '10H']], 'S', 0, [9, 0, 0]);
      const r = playAll(s, [[0, 'KH'], [1, '7H'], [2, '9H']]);
      eq('King to 10 ends the game mid-hand', [s.phase, s.gameOver, s.winner, s.scores[0]], [P.GAME_OVER, true, 0, 10]);
      check('GAME_ENDED is the last event', r.events[r.events.length - 1].type === 'GAME_ENDED');
      check('no action after game over', !D(s, { type: 'ADVANCE' }).ok && !D(s, { type: 'PLAY', player: 0, card: 'AH' }).ok);

      const hand = (tricks, caller, scores) => {
        const st = Engine.createGame(3); D(st, { type: 'START_GAME' });
        st.phase = P.TRICK_DONE; st.trickNumber = 7; st.totalTricks = 7; st.tricksWon = tricks.slice(); st.caller = caller; st.trump = 'S';
        st.trickWinners = []; tricks.forEach((n, p) => { for (let i = 0; i < n; i++) st.trickWinners.push(p); });
        if (scores) st.scores = scores.slice();
        const res = D(st, { type: 'ADVANCE' });
        return { st, res };
      };
      let h = hand([4, 2, 1], 1);
      eq('clear winner +1', [h.st.scores, h.st.phase, h.st.handSummary.outcome], [[1, 0, 0], P.HAND_SCORE, 'CLEAR_WINNER']);
      h = hand([2, 2, 3], 0);
      eq('clear winner with 3 tricks', h.st.scores, [0, 0, 1]);
      h = hand([7, 0, 0], 0);
      eq('namer sweep +2', [h.st.scores, h.st.handSummary.outcome], [[2, 0, 0], 'NAMER_SWEEP']);
      h = hand([0, 7, 0], 0);
      eq('non-namer sweep +3', [h.st.scores, h.st.handSummary.outcome], [[0, 3, 0], 'NON_NAMER_SWEEP']);
      h = hand([4, 2, 1], 2, [9, 5, 5]);
      eq('end-of-hand point to exactly 10 ends the game', [h.st.phase, h.st.winner, h.st.scores[0]], [P.GAME_OVER, 0, 10]);
      h = hand([3, 3, 1], 0);
      eq('3-3-1 starts a Showdown, no hand points', [h.st.phase, h.st.scores, h.st.showdown.mediator, h.st.showdown.participants], [P.SHOWDOWN_SETUP, [0, 0, 0], 2, [0, 1]]);
      h = hand([1, 3, 3], 0);
      eq('mediator is the 1-trick player', [h.st.showdown.mediator, h.st.showdown.participants], [0, [1, 2]]);
      h = hand([4, 2, 1], 1);
      const before = h.st.dealer;
      D(h.st, { type: 'ADVANCE' });
      eq('dealer rotates after a scored hand', [h.st.phase, h.st.dealer], [P.HAND_START, Engine.seatAfter(before)]);
    });

    /* --- Showdown --- */
    safeRun('showdown', () => {
      const pool = ['AS', 'KS', 'QS', '10S', 'AH', 'KH', 'QH', 'AD', 'KD', 'QD', 'AC', 'KC'];
      const mk = scores => {
        const st = Engine.createGame(11); D(st, { type: 'START_GAME' });
        st.phase = P.TRICK_DONE; st.trickNumber = 7; st.totalTricks = 7; st.trump = 'S'; st.caller = 0;
        st.tricksWon = [3, 3, 1]; st.trickWinners = [0, 1, 0, 1, 0, 1, 2];
        st.deck = []; st.outside = pool.slice();
        st.wonPile = R.ALL_IDS.filter(id => !pool.includes(id));
        if (scores) st.scores = scores.slice();
        return st;
      };
      let s = mk();
      D(s, { type: 'ADVANCE' });
      eq('showdown setup', [s.phase, s.showdown.mediator], [P.SHOWDOWN_SETUP, 2]);
      D(s, { type: 'ADVANCE' });
      eq('6 cards to each participant, mediator none', s.hands.map(h => h.length), [6, 6, 0]);
      eq('12-card pool fully dealt from the outside pile', [s.outside.length, s.hands[0].concat(s.hands[1]).sort()], [0, pool.slice().sort()]);
      eq('showdown audit', Engine.audit(s), []);
      check('mediator cannot discard', !D(s, { type: 'SHOWDOWN_DISCARD', player: 2, card: 'AS' }).ok);
      D(s, { type: 'SHOWDOWN_DISCARD', player: 0, card: s.hands[0][0] });
      check('showdown waits for both discards', s.phase === P.SHOWDOWN_DISCARD);
      D(s, { type: 'SHOWDOWN_DISCARD', player: 1, card: s.hands[1][0] });
      eq('5 cards each after discard, play begins', [s.hands.map(h => h.length), s.phase, s.totalTricks], [[5, 5, 0], P.SHOWDOWN_PLAY, 5]);
      eq('lead traces back past the mediator\'s trick 7', [s.leader, s.showdown.lead.mainTrick], [1, 6]);
      eq('trump persists', s.trump, 'S');
      let tricks = 0;
      while (!s.gameOver && (s.phase === P.SHOWDOWN_PLAY || s.phase === P.SHOWDOWN_TRICK_DONE)) {
        if (s.phase === P.SHOWDOWN_PLAY) { const p = s.currentPlayer; const r2 = D(s, AI.decide(buildView(s, p))); if (!r2.ok) throw new Error(r2.error); }
        else { tricks++; D(s, { type: 'ADVANCE' }); }
      }
      eq('five showdown tricks', [tricks, s.showdown.tricksWon[0] + s.showdown.tricksWon[1], s.showdown.tricksWon[2]], [5, 5, 0]);
      eq('showdown scored', s.phase, P.SHOWDOWN_SCORE);
      const w = s.handSummary.showdown.winner, l = s.handSummary.showdown.loser;
      check('showdown winner gets +1 (plus any King points)', s.scores[w] >= 1);
      check('showdown loser floor at 0', s.scores[l] >= 0);
      eq('mediator score unchanged', s.scores[2], 0);
      eq('showdown final audit', Engine.audit(s), []);
      D(s, { type: 'ADVANCE' });
      eq('next hand after showdown', s.phase, P.HAND_START);

      /* Exact Showdown scoring with controlled trick counts. */
      const sc = (scores, tw) => {
        const st = mk(scores); D(st, { type: 'ADVANCE' }); D(st, { type: 'ADVANCE' });
        D(st, { type: 'SHOWDOWN_DISCARD', player: 0, card: st.hands[0][0] }); D(st, { type: 'SHOWDOWN_DISCARD', player: 1, card: st.hands[1][0] });
        st.phase = P.SHOWDOWN_TRICK_DONE; st.trickNumber = 5; st.showdown.tricksWon = tw;
        D(st, { type: 'ADVANCE' });
        return st;
      };
      s = sc([0, 0, 4], [3, 2, 0]);
      eq('showdown: winner +1, loser at 0 stays 0', s.scores, [1, 0, 4]);
      s = sc([4, 6, 0], [1, 4, 0]);
      eq('showdown: winner +1, loser -1', s.scores, [3, 7, 0]);
      s = sc([9, 4, 0], [4, 1, 0]);
      eq('showdown win to 10 ends game; loser not reduced', [s.phase, s.winner, s.scores], [P.GAME_OVER, 0, [10, 4, 0]]);

      /* Showdown King scoring and mid-Showdown victory. */
      const sk = scores => {
        const st = Engine.createGame(12); D(st, { type: 'START_GAME' });
        st.trump = 'S'; st.showdown = { active: true, mediator: 2, participants: [0, 1], pendingDiscard: [false, false, false], discards: [], tricksWon: [0, 0, 0], trickWinners: [], lead: null };
        st.activePlayers = [0, 1]; st.hands = [['7H', '8H'], ['KH', '9C'], []]; st.phase = P.SHOWDOWN_PLAY; st.totalTricks = 5; st.trickNumber = 1;
        st.leader = 1; st.currentPlayer = 1; st.trick = { leader: 1, plays: [], leadSuit: null };
        if (scores) st.scores = scores.slice();
        D(st, { type: 'PLAY', player: 1, card: 'KH' }); const r3 = D(st, { type: 'PLAY', player: 0, card: '7H' });
        return { st, r3 };
      };
      let k = sk();
      eq('showdown King scores +1', [k.st.scores, k.st.phase], [[0, 1, 0], P.SHOWDOWN_TRICK_DONE]);
      check('showdown King event', k.r3.events.some(e => e.type === 'KING_SCORED' && e.showdown));
      k = sk([0, 9, 3]);
      eq('showdown King to 10 ends the game', [k.st.phase, k.st.winner], [P.GAME_OVER, 1]);
    });

    /* --- Restart --- */
    safeRun('restart', () => {
      const s = Engine.createGame(77);
      eq('new game is clean', [s.phase, s.scores, s.handNumber, s.gameOver, Engine.audit(s)], [P.SETUP, [0, 0, 0], 0, false, []]);
    });

    /* --- Full AI-vs-AI simulations with invariants --- */
    safeRun('simulation', () => {
      const games = o.games || 40;
      const stats = { hands: 0, showdowns: 0, abandoned: 0, jokerVoid: 0, namerSweep: 0, nonNamerSweep: 0, kingPts: 0, endKing: 0, endShowdown: 0, endHand: 0, illegalRejected: 0, steps: 0 };
      let problems = [];
      for (let g = 0; g < games && problems.length < 5; g++) {
        const s = Engine.createGame(1000 + g);
        D(s, { type: 'START_GAME' });
        let prevDealer = s.dealer, steps = 0;
        while (!s.gameOver && steps < 20000) {
          steps++;
          const actors = Engine.actors(s);
          let action;
          if (actors.length) {
            const p = actors[0];
            const view = buildView(s, p);
            if (Engine.PLAY_PHASES.includes(s.phase)) {
              const illegal = s.hands[p].find(id => !view.legal.includes(id));
              if (illegal) { if (D(s, { type: 'PLAY', player: p, card: illegal }).ok) problems.push('illegal card accepted'); else stats.illegalRejected++; }
              for (const q of [0, 1, 2]) if (q !== p && view.hand.some(id => s.hands[q].includes(id))) problems.push('view leaked a hand');
            }
            action = AI.decide(view);
          } else action = Engine.systemAction(s);
          const phaseBefore = s.phase;
          if (phaseBefore === P.HAND_SCORE || phaseBefore === P.SHOWDOWN_SCORE || phaseBefore === P.ABANDONED) prevDealer = s.dealer;
          const res = D(s, action);
          if (!res.ok) { problems.push('AI/system action rejected: ' + res.error + ' in ' + phaseBefore); break; }
          const a = Engine.audit(s);
          if (a.length) { problems.push('audit: ' + a.join(',') + ' after ' + action.type); break; }
          if (s.scores.some(x => x < 0)) problems.push('negative score');
          const endIdx = res.events.findIndex(e => e.type === 'GAME_ENDED');
          if (endIdx >= 0 && endIdx !== res.events.length - 1) problems.push('events after GAME_ENDED');
          for (const e of res.events) {
            if (e.type === 'DEAL') stats.hands++;
            if (e.type === 'SHOWDOWN_STARTED') stats.showdowns++;
            if (e.type === 'HAND_ABANDONED') stats.abandoned++;
            if (e.type === 'HAND_VOID') stats.jokerVoid++;
            if (e.type === 'HAND_SCORED' && e.outcome === 'NAMER_SWEEP') stats.namerSweep++;
            if (e.type === 'HAND_SCORED' && e.outcome === 'NON_NAMER_SWEEP') stats.nonNamerSweep++;
            if (e.type === 'KING_SCORED') stats.kingPts++;
            if (e.type === 'TRICK_STARTED' && e.number === 1 && !e.showdown && s.outside.length !== 12) problems.push('outside pile not 12 at play');
            if (e.type === 'DEALER_ROTATED' && e.dealer !== (prevDealer + 1) % 3) problems.push('dealer rotation wrong');
            if (e.type === 'GAME_ENDED') {
              if (/KING/.test(e.reason)) stats.endKing++; else if (/SHOWDOWN/.test(e.reason)) stats.endShowdown++; else stats.endHand++;
            }
          }
        }
        stats.steps += steps;
        if (!s.gameOver) problems.push('game ' + g + ' did not finish');
        else {
          const over = s.scores.filter(x => x >= 10).length;
          if (over !== 1 || s.scores[s.winner] < 10) problems.push('bad final scores ' + s.scores.join('-'));
        }
      }
      check('simulated ' + games + ' AI games with no rule violations', problems.length === 0, problems.slice(0, 5).join('; '));
      results.stats = stats;
    });

    Logger.enabled = wasLogging;
    const passed = results.filter(r => r.ok).length;
    return { passed, failed: results.length - passed, results, stats: results.stats, ms: Date.now() - t0 };

    /* helpers (hoisted) */
    function playState(hands, trump, leader, scores) {
      const s = Engine.createGame(7);
      Engine.dispatch(s, { type: 'START_GAME' });
      s.phase = P.TRICK_PLAY; s.trump = trump; s.caller = leader; s.dealer = (leader + 2) % 3;
      s.hands = hands.map(h => h.slice()); s.activePlayers = [0, 1, 2]; s.totalTricks = 7; s.trickNumber = 1;
      s.leader = leader; s.currentPlayer = leader; s.trick = { leader, plays: [], leadSuit: null };
      if (scores) s.scores = scores.slice();
      return s;
    }
    function playAll(s, seq) {
      let last = null;
      for (const [p, c] of seq) { last = Engine.dispatch(s, { type: 'PLAY', player: p, card: c }); if (!last.ok) throw new Error('play rejected: ' + last.error); }
      return last;
    }
    /* Deal, force a chosen card to the kitty top, and discard the first 3 cards of each hand. */
    function revealState(seed, dealer, topCard) {
      const s = Engine.createGame(seed);
      Engine.dispatch(s, { type: 'START_GAME' });
      s.dealer = dealer;
      Engine.dispatch(s, { type: 'DEAL' });
      const where = [s.hands[0], s.hands[1], s.hands[2], s.kitty].find(a => a.includes(topCard));
      const i = where.indexOf(topCard);
      where[i] = s.kitty[0]; s.kitty[0] = topCard;
      for (const p of [0, 1, 2]) Engine.dispatch(s, { type: 'DISCARD', player: p, cards: s.hands[p].slice(0, 3) });
      return s;
    }
  }
  return Object.freeze({ run });
})();

/* ---------------------------------------------------------------------
   10. BOOT
   --------------------------------------------------------------------- */
window.KCT = Object.freeze({ Rules, RNG, Logger, Engine, buildView, AI, Render, App, SelfTest });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init());
else App.init();
</script>
