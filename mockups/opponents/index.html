<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>King Cut-Throat Opponents</title>
<style>
/* Layout: the game's felt and seat panels; a tap on a bot's figure opens its profile in a modal. Single dark look, same as the game. */
:root{
  color-scheme:dark;
  --page:#0a2a19; --felt:#155a36; --felt-edge:#0c3a22;
  --panel:rgba(0,0,0,.26); --panel-strong:rgba(0,0,0,.42); --sheet:#10301f; --line:rgba(255,255,255,.12);
  --ink:#f5f2e9; --muted:#bccbbf; --gold:#f2c14e; --gold-ink:#3a2a00; --ai:#33507a;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:40px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-inline:var(--s4);padding-block:var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s5)}
h1,h2,h3,p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.intro{display:flex;flex-direction:column;gap:var(--s2);max-width:62ch}
.intro h1{font-size:20px;font-weight:800;text-wrap:balance}
.intro p{color:var(--muted);font-size:14px}

/* Table (mirrors the game's seat panels) */
.table{background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt-edge) 100%);border-radius:18px;padding:var(--s3);display:grid;gap:var(--s3);grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.seat{background:var(--panel);border-radius:14px;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-width:0;border:2px solid transparent}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
.seat-id{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.seat-name{font-weight:800;font-size:16px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.16);text-transform:uppercase}
.tag.ai{background:var(--ai)} .tag.you{background:#7a5c13} .tag.dealer{background:#ece6d4;color:#222}
.score{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:13px;font-weight:600;color:var(--muted)}
.seat-meta{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px var(--s3);font-size:13px;color:var(--muted)}
.seat-meta b{color:var(--ink)}
.thinking{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gold)}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.center{grid-column:1 / -1;display:flex;flex-direction:column;gap:var(--s2);background:var(--panel-strong);border-radius:12px;padding:var(--s3) var(--s4)}
.logline{display:flex;align-items:center;gap:var(--s2);font-size:14px}
.logline .who{font-weight:700}
.me{grid-column:1 / -1}

/* Figures: the transparent art itself, no frame. Board sizes stay small. */
.av{flex:none;display:inline-block;background:center bottom/contain no-repeat}
.av.board{width:30px;height:30px}.av.log{width:16px;height:16px}.av.big{width:132px;height:132px}
.face{all:unset;cursor:pointer;display:inline-flex;border-radius:6px;line-height:0}
.face:hover .av{transform:scale(1.08)}
.face .av{transition:transform .12s}
.face:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Mockup-only control */
.mock{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:var(--s4)}
.btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink);font:inherit;font-size:14px}
.btn:hover{background:rgba(255,255,255,.18)}

/* Profile modal */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--sheet);color:var(--ink);padding:0;width:min(360px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s5)}
.sheet-top{display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center}
.sheet-top h2{font-size:24px;font-weight:800;letter-spacing:.02em}
.read{font-size:15px;font-style:italic}
.style{font-size:13px;color:var(--muted);text-align:center}
.close{align-self:center}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:1}.face .av{transition:none}}
</style>

<div class="wrap">
  <div class="intro">
    <span class="eyebrow">King Cut-Throat · visual mockup</span>
    <h1>Bot opponents at the table</h1>
    <p>Tap a bot's figure, in its seat or in the log, to open its profile.</p>
  </div>

  <div class="table" id="table"></div>

  <div class="mock">
    <button class="btn" type="button" id="deal">Deal new opponents</button>
    <span>Mockup only. Shows another pair of the ten.</span>
  </div>
</div>

<dialog id="profile" aria-labelledby="pName">
  <div class="sheet">
    <div class="sheet-top"><span class="av big" id="pImg" role="img"></span><h2 id="pName"></h2><p class="read" id="pRead"></p></div>
    <p class="style" id="pStyle"></p>
    <button class="btn close" type="button" id="pClose">Close</button>
  </div>
</dialog>

const byId = Object.fromEntries(CHARS.map(c => [c.id, c]));

let next = 2;
const order = ['gus', 'prof', 'tex', 'auditor', 'sweat', 'shade', 'monk', 'hustler', 'rookie', 'diva'];
seats = [order[0], order[1]];
const face = (c, size) => `<button class="face" type="button" data-id="${c.id}" aria-label="About ${c.name}"><span class="av ${size}" style="background-image:url(${c.img})"></span></button>`;

function seatHTML(c, opts) {
  return `<div class="seat ${opts.turn ? 'turn' : ''}">
    <div class="seat-id">${face(c, 'board')}<span class="seat-name">${c.name}</span><span class="tag ai">AI</span>${opts.dealer ? '<span class="tag dealer">Dealer</span>' : ''}</div>
    <div class="score">${opts.score}<small> / 10</small></div>
    <div class="seat-meta"><span>Tricks: <b>${opts.tricks}</b></span>${opts.turn ? '<span class="thinking">Thinking<i></i><i></i><i></i></span>' : ''}</div>
  </div>`;
}
function render() {
  const w = byId[seats[0]], e = byId[seats[1]];
  document.getElementById('table').innerHTML =
    seatHTML(w, { score: 4, tricks: 2, dealer: true }) +
    seatHTML(e, { score: 6, tricks: 1, turn: true }) +
    `<div class="center"><span class="eyebrow">Latest scroll</span>
      <div class="logline">${face(w, 'log')}<span><span class="who">${w.name}</span> ${w.quip}</span></div>
      <div class="logline">${face(e, 'log')}<span><span class="who">${e.name}</span> ${e.quip}</span></div></div>` +
    `<div class="seat me"><div class="seat-id"><span class="seat-name">You</span><span class="tag you">Human</span></div><div class="seat-meta"><span>Score <b>3</b> / 10</span><span>Tricks: <b>2</b></span></div></div>`;
}
const dlg = document.getElementById('profile');
function openProfile(c) {
  document.getElementById('pImg').style.backgroundImage = `url(${c.img})`;
  document.getElementById('pImg').setAttribute('aria-label', c.name);
  document.getElementById('pName').textContent = c.name;
  document.getElementById('pRead').textContent = '“' + c.read + '”';
  document.getElementById('pStyle').textContent = c.style;
  dlg.showModal();
}
document.getElementById('table').addEventListener('click', ev => { const b = ev.target.closest('.face'); if (b) openProfile(byId[b.dataset.id]); });
document.getElementById('pClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });
document.getElementById('deal').addEventListener('click', () => { seats = [order[next % 10], order[(next + 1) % 10]]; next += 2; render(); });
render();
</script>
